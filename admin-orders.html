<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><title>TDM Admin | Orders</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-common.js"></script><script src="admin-common.js"></script><link rel="stylesheet" href="admin-ui.css"></head><body><div class="admin-shell"><header class="admin-header"><div class="brand"><img src="logo.png"><div><strong>TDM Manufacturing</strong><span>Orders Management</span></div></div><div class="toolbar" style="justify-content:flex-end"><a class="btn secondary" href="admin-dashboard.html">Dashboard</a><button onclick="tdmAdminLogout()" class="logout">Log Out</button></div></header><main><div class="dashboard-head"><div><h1>📦 Orders</h1><p class="muted">Search, review and update every customer order.</p></div><button onclick="loadOrders()">Refresh</button></div><div class="stats" id="stats"></div><div class="admin-card"><div class="toolbar"><input id="search" placeholder="Search customer, phone, email, product or order ID"><select id="status"><option>All</option><option>Confirmed</option><option>Processing</option><option>Ready</option><option>Shipped</option><option>Delivered</option></select><select id="payment"><option>All payments</option><option value="unpaid">Unpaid</option><option value="paid">Paid</option><option value="failed">Failed</option></select></div><p id="msg" class="status"></p></div><div id="orders" class="card-grid"></div></main></div><script>let allOrders=[],customers={};async function init(){if(!await tdmAdminRequire())return;document.getElementById('search').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);document.getElementById('payment').addEventListener('change',render);await loadOrders()}async function loadOrders(){const msg=document.getElementById('msg');msg.textContent='Loading orders…';const c=tdmAdminClient();const r=await c.from('Orders').select('*').order('created_at',{ascending:false});if(r.error){msg.textContent=r.error.message;return;}allOrders=r.data||[];const u=await c.from('Customers').select('id,full_name,email,phone');customers=Object.fromEntries((u.data||[]).map(x=>[x.id,x]));renderStats();render();msg.textContent=allOrders.length+' order(s)';}function renderStats(){const s=document.getElementById('stats');const sales=allOrders.reduce((n,o)=>n+Number(o.checkout_total??o.total_amount??0),0);s.innerHTML=[['Orders',allOrders.length],['Confirmed',allOrders.filter(x=>x.status==='Confirmed').length],['Processing',allOrders.filter(x=>x.status==='Processing').length],['Shipped',allOrders.filter(x=>x.status==='Shipped').length],['Delivered',allOrders.filter(x=>x.status==='Delivered').length],['Sales',tdmAdminMoney(sales)]].map(x=>`<div><b>${x[0]}</b><strong>${x[1]}</strong></div>`).join('')}function render(){const q=document.getElementById('search').value.trim().toLowerCase(),sf=document.getElementById('status').value,pf=document.getElementById('payment').value;const rows=allOrders.filter(o=>{const c=customers[o.user_id]||{},text=[o.id,o.product_name,o.customer_name,o.customer_phone,c.full_name,c.email,c.phone].join(' ').toLowerCase();return (!q||text.includes(q))&&(sf==='All'||o.status===sf)&&(pf==='All payments'||o.payment_status===pf)});document.getElementById('orders').innerHTML=rows.length?rows.map(orderCard).join(''):'<div class="admin-card"><p>No matching orders.</p></div>'}function orderCard(o){const c=customers[o.user_id]||{};const addr=[o.shipping_address,o.shipping_city,o.shipping_state,o.shipping_country].filter(Boolean).join(', ');return `<article class="item-card"><div class="toolbar"><span class="pill">${tdmAdminEsc(o.status||'Confirmed')}</span><span class="pill">Payment: ${tdmAdminEsc(o.payment_status||'unpaid')}</span></div><h2>${tdmAdminEsc(o.product_name||'TDM Product')}</h2><p><b>Customer:</b> ${tdmAdminEsc(o.customer_name||c.full_name||'Customer')}</p><p><b>Email:</b> ${tdmAdminEsc(c.email||'')}</p><p><b>Phone:</b> ${tdmAdminEsc(o.customer_phone||c.phone||'')}</p><p><b>Address:</b> ${tdmAdminEsc(addr||'Not supplied')}</p><p><b>Quantity:</b> ${Number(o.quantity||1)} · <b>Total:</b> ${tdmAdminMoney(o.checkout_total??o.total_amount)}</p><p><b>Order ID:</b> ${tdmAdminEsc(o.id)}<br><b>Date:</b> ${new Date(o.created_at).toLocaleString()}</p><label>Order status</label><select onchange="updateOrder('${o.id}',{status:this.value})"><option ${o.status==='Confirmed'?'selected':''}>Confirmed</option><option ${o.status==='Processing'?'selected':''}>Processing</option><option ${o.status==='Ready'?'selected':''}>Ready</option><option ${o.status==='Shipped'?'selected':''}>Shipped</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option></select><label>Payment status</label><select onchange="updateOrder('${o.id}',{payment_status:this.value})"><option value="unpaid" ${o.payment_status==='unpaid'?'selected':''}>Unpaid</option><option value="paid" ${o.payment_status==='paid'?'selected':''}>Paid</option><option value="failed" ${o.payment_status==='failed'?'selected':''}>Failed</option></select><label>Tracking number</label><input value="${tdmAdminEsc(o.tracking_number||'')}" onchange="updateOrder('${o.id}',{tracking_number:this.value})" placeholder="Optional tracking number"><div class="toolbar"><a class="btn secondary" target="_blank" href="https://wa.me/${String(o.customer_phone||c.phone||'').replace(/[^0-9]/g,'')}">WhatsApp</a><button onclick="saveTracking('${o.id}',this)">Save Tracking</button></div></article>`}async function updateOrder(id,patch){const r=await tdmAdminClient().from('Orders').update(patch).eq('id',id);if(r.error){alert(r.error.message);return;}await loadOrders()}async function saveTracking(id,btn){const input=btn.closest('.item-card').querySelector('input[placeholder]');await updateOrder(id,{tracking_number:input.value.trim()})}init();</script></body></html>
