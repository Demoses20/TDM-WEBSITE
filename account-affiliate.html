<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><title>TDM Affiliate Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="customer-common.js"></script><link rel="stylesheet" href="customer-ui.css"><style>body{margin:0;background:#fff7ed;font-family:Arial,sans-serif;color:#171717;padding-bottom:95px}.wrap{max-width:900px;margin:auto;padding:16px}.head{background:#fff;border:1px solid #fed7aa;border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center}.head img{width:44px;height:44px;border-radius:9px}.card{background:#fff;border:1px solid #fed7aa;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(249,115,22,.07)}button,.btn{border:0;border-radius:11px;padding:12px 15px;background:#f97316;color:#fff;font-weight:900;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #fdba74;border-radius:10px;margin:6px 0 10px;font:inherit}.muted{color:#667085}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#15803d;font-weight:800;font-size:12px}.product-row{border-top:1px solid #eee;padding:12px 0}.linkbox{word-break:break-all}.danger{color:#b91c1c}</style></head><body><main class="wrap"><div class="head"><a href="account-dashboard.html"><img src="logo.png"></a><div><b>TDM Manufacturing</b><div class="muted">Affiliate Marketing</div></div></div><div id="guard" class="card">Loading…</div><div id="content" style="display:none"><section class="card"><h1>🤝 Affiliate Program</h1><div id="status"></div><button id="join" onclick="joinAffiliate()">Join Affiliate Program</button><div id="tools" style="display:none"><label>Affiliate code</label><input id="code" readonly><button onclick="copyValue(code.value,this)">Copy Code</button><label>Personal affiliate link</label><input id="link" readonly><button onclick="copyValue(link.value,this)">Copy Link</button></div></section><section class="card"><h2>Products to promote</h2><input id="search" placeholder="Search published products"><div id="products">Loading…</div></section><section class="card"><h2>Rewards</h2><div class="row"><span>Available</span><b id="balance">₦0</b></div><div class="row"><span>Lifetime</span><b id="lifetime">₦0</b></div><h3>Payout account</h3><input id="bankName" placeholder="Bank name"><input id="accountName" placeholder="Account name"><input id="accountNumber" placeholder="Account number"><button onclick="savePayout()">Save Payout Account</button><h3>Withdraw</h3><input id="amount" type="number" min="1" placeholder="Amount"><button onclick="withdraw()">Request Withdrawal</button><p id="walletMsg"></p></section></div></main><nav class="tdm-customer-nav" aria-label="Main app navigation"><a href="index.html"><span>⌂</span>Home</a><a href="product.html"><span>▦</span>Store</a><a href="cart.html"><span>🛒</span>Cart <b id="cartCountBottom" class="cart-count">0</b></a><a href="service.html"><span>⚙</span>Service</a><a href="account-dashboard.html"><span>♙</span>Account</a></nav><script>let user=null,aff=null,rows=[];const c=()=>tdmCustomerClient();const esc=v=>tdmEsc(v);async function init(){user=await tdmRequireUser();if(!user)return;guard.style.display='none';content.style.display='block';const r=await c().from('affiliates').select('*').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;aff=r.data||null;renderAffiliate();await loadProducts();search.addEventListener('input',renderProducts)}function renderAffiliate(){if(!aff){status.innerHTML='<p>Not registered yet.</p>';join.style.display='inline-flex';tools.style.display='none';return;}status.innerHTML='<span class="pill">Active</span>';join.style.display='none';tools.style.display='block';code.value=aff.affiliate_code;link.value=new URL('product.html',location.href).href+'?ref='+encodeURIComponent(aff.affiliate_code);balance.textContent=tdmMoney(aff.reward_balance);lifetime.textContent=tdmMoney(aff.lifetime_rewards);const p=aff.payout_account||{};bankName.value=p.bank_name||'';accountName.value=p.account_name||'';accountNumber.value=p.account_number||''}async function joinAffiliate(){const affiliate_code='TDM-'+user.id.replace(/-/g,'').slice(0,10).toUpperCase();const r=await c().from('affiliates').insert({user_id:user.id,affiliate_code});if(r.error){status.textContent=r.error.message;return;}aff={user_id:user.id,affiliate_code,reward_balance:0,lifetime_rewards:0,status:'active'};renderAffiliate()}async function loadProducts(){const r=await c().from('affiliate_products').select('*').eq('active',true).order('created_at',{ascending:false});if(r.error){products.innerHTML='<p>'+esc(r.error.message)+'</p>';return;}rows=r.data||[];renderProducts()}function renderProducts(){const q=search.value.trim().toLowerCase(),list=rows.filter(x=>String(x.product_name).toLowerCase().includes(q));products.innerHTML=list.length?list.map(x=>`<div class="product-row"><div class="row"><b>${esc(x.product_name)}</b><span>${Number(x.commission_rate||0)}%</span></div><button onclick="makeProductLink('${esc(x.product_id)}')">Get Affiliate Product Link</button></div>`).join(''):'No published affiliate products yet.'}function productLink(productId){const u=new URL('product.html',location.href);u.searchParams.set('product',productId);u.searchParams.set('ref',aff.affiliate_code);return u.href}async function makeProductLink(productId){if(!aff){alert('Join the affiliate program first.');return;}const l=productLink(productId);try{await c().rpc('tdm_log_affiliate_click',{p_affiliate_code:aff.affiliate_code,p_product_id:String(productId)})}catch(e){}const box=document.createElement('div');box.className='card';box.innerHTML='<b>Affiliate product link</b><input readonly class="linkbox"><a class="btn" target="_blank" rel="noopener">Open Product</a> <button>Copy Link</button>';box.querySelector('input').value=l;box.querySelector('a').href=l;box.querySelector('button').onclick=e=>copyValue(l,e.currentTarget);products.prepend(box);await copyValue(l,box.querySelector('button'));}async function copyValue(v,btn){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(v);else{const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}if(btn){const old=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=old,1400)}}catch(e){alert(v)}}async function savePayout(){if(!aff)return;const payout_account={bank_name:bankName.value.trim(),account_name:accountName.value.trim(),account_number:accountNumber.value.trim()};const r=await c().from('affiliates').update({payout_account}).eq('user_id',user.id);walletMsg.textContent=r.error?r.error.message:'Payout account saved.'}async function withdraw(){const n=Number(amount.value);if(!aff||!n||n<=0){walletMsg.textContent='Enter a valid amount.';return}if(n>Number(aff.reward_balance||0)){walletMsg.textContent='Amount exceeds available rewards.';return}const payout_account={bank_name:bankName.value.trim(),account_name:accountName.value.trim(),account_number:accountNumber.value.trim()};const r=await c().from('affiliate_withdrawals').insert({user_id:user.id,amount:n,payout_method:'bank_transfer',payout_account});walletMsg.textContent=r.error?r.error.message:'Withdrawal request submitted.';if(!r.error)amount.value=''}init().catch(e=>{guard.textContent='Unable to load affiliate area: '+e.message});</script></body></html>
