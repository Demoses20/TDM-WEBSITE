<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TDM Customer Sign Up</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#f97316"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-common.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(145deg,#fff7ed,#ffedd5,#fff);padding:18px;color:#111827}.auth-page{width:min(470px,100%);margin:auto}.top{text-align:center;margin:8px 0 15px}.logo{width:86px;height:86px;padding:6px;border-radius:24px;background:linear-gradient(145deg,#f97316,#fb923c);display:inline-block;box-shadow:0 10px 25px #f9731640}.logo img{width:100%;height:100%;object-fit:contain;border-radius:18px;background:#111}.card{background:#fff;border:2px solid #f97316;border-radius:28px;padding:23px;box-shadow:0 20px 50px #f9731620}.card h1{text-align:center;margin:0 0 5px;font-size:26px}.sub{text-align:center;color:#6b7280;margin:0 0 20px}.step{display:none}.step.active{display:block}.field{margin:12px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;padding:14px;border:1.5px solid #fdba74;border-radius:13px;font:inherit;background:#fff}.field input:focus,.field select:focus{border-color:#f97316;outline:none;box-shadow:0 0 0 3px #f9731620}.phone-row{display:grid;grid-template-columns:145px 1fr;gap:8px}.verify-choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}.choice{padding:11px;border:1.5px solid #fdba74;border-radius:12px;text-align:center;font-weight:800;cursor:pointer}.choice.active{background:#f97316;color:#fff;border-color:#f97316}.btn{width:100%;padding:14px;border:0;border-radius:14px;background:#f97316;color:#fff;font-weight:900;font-size:16px;margin-top:9px}.btn.alt{background:#fff;color:#c2410c;border:2px solid #f97316}.message{min-height:24px;text-align:center;font-size:14px;margin-top:12px;line-height:1.4}.hint{font-size:12px;color:#6b7280;line-height:1.45}.links{text-align:center;margin-top:17px}.links a,.back{color:#c2410c;font-weight:800;text-decoration:none}.back{display:block;text-align:center;margin-top:14px}.success{padding:12px;background:#fff7ed;border:1px solid #fdba74;border-radius:12px;margin-top:12px;font-size:13px}
</style>  <script src="pwa-install.js"></script>
</head><body><main class="auth-page"><div class="top"><div class="logo"><img src="logo.png" alt="TDM Manufacturing"></div></div><section class="card"><h1>Create Customer Account</h1><p class="sub">Verify your contact first, then complete your account.</p>
<div id="step1" class="step active"><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><button class="btn" id="sendBtn">Send Verification Code</button><p class="hint">A verification code will be sent to your email address.</p><div class="message" id="message"></div></div>
<div id="step2" class="step"><div class="field"><label>Email verification code</label><input id="otp" inputmode="numeric" maxlength="8" placeholder="Enter the code"></div><button class="btn" id="verifyBtn">Verify Email</button><button class="btn alt" id="resendBtn">Resend Code</button><div class="message" id="verifyMessage"></div></div>
<div id="step3" class="step"><div class="field"><label>Surname</label><input id="surname" autocomplete="family-name" placeholder="Surname"></div><div class="field"><label>First name</label><input id="firstName" autocomplete="given-name" placeholder="Name"></div><div class="field"><label>Phone number</label><input id="phoneProfile" type="tel" autocomplete="tel" placeholder="08012345678"></div><div class="field"><label>Home address</label><input id="homeAddress" autocomplete="street-address" placeholder="Home address"></div><div class="field"><label>Delivery address</label><input id="deliveryAddress" autocomplete="street-address" placeholder="Delivery address"></div><div class="field"><label>Create password</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div><button class="btn" id="finishBtn">Create My Account</button><div class="message" id="finishMessage"></div></div>
<div class="links">Already registered? <a href="login.html">Log in</a></div><a class="back" href="auth.html">← Back</a></section></main>
<script>
const client=tdmAuthClient();let contact='',verifiedUser=null;
const $=id=>document.getElementById(id);

async function sendCode(){
  const msg=$('message');
  contact=$('email').value.trim().toLowerCase();
  if(!contact||!contact.includes('@')){msg.textContent='Enter a valid email address.';return}
  msg.textContent='Sending verification code...';
  $('sendBtn').disabled=true;
  try{
    const {error}=await client.auth.signInWithOtp({email:contact,options:{shouldCreateUser:true}});
    if(error)throw error;
    $('step1').classList.remove('active');
    $('step2').classList.add('active');
    $('verifyMessage').textContent='Verification code sent to '+contact+'.';
  }catch(e){msg.textContent='Could not send code: '+e.message}
  finally{$('sendBtn').disabled=false}
}

async function verify(){
  const code=$('otp').value.trim(),msg=$('verifyMessage');
  if(!code){msg.textContent='Enter the verification code.';return}
  msg.textContent='Verifying...';$('verifyBtn').disabled=true;
  try{
    const {data,error}=await client.auth.verifyOtp({email:contact,token:code,type:'email'});
    if(error)throw error;
    if(!data.user)throw new Error('Verification completed but no account session was returned.');
    verifiedUser=data.user;
    $('step2').classList.remove('active');
    $('step3').classList.add('active');
    $('finishMessage').textContent='Email verified. Complete your account details below.';
  }catch(e){msg.textContent='Verification failed: '+e.message}
  finally{$('verifyBtn').disabled=false}
}

async function resend(){
  const msg=$('verifyMessage');
  msg.textContent='Resending verification code...';
  try{
    const {error}=await client.auth.signInWithOtp({email:contact,options:{shouldCreateUser:true}});
    if(error)throw error;
    msg.textContent='A new verification code has been sent.';
  }catch(e){msg.textContent='Could not resend code: '+e.message}
}

async function finish(){
  const msg=$('finishMessage'),
    surname=$('surname').value.trim(),
    first=$('firstName').value.trim(),
    phone=$('phoneProfile').value.trim(),
    home=$('homeAddress').value.trim(),
    delivery=$('deliveryAddress').value.trim(),
    password=$('newPassword').value;
  if(!surname||!first||!phone||!home||!delivery||password.length<6){
    msg.textContent='Please complete all fields and use a password of at least 6 characters.';
    return;
  }
  msg.textContent='Creating your customer profile...';$('finishBtn').disabled=true;
  try{
    const fullName=surname+' '+first;
    const email=contact;
    const metadata={full_name:fullName,surname,first_name:first,email,phone,home_address:home,delivery_address:delivery,signup_verified_by:'email'};
    const {data,error}=await client.auth.updateUser({password,data:metadata});
    if(error)throw error;
    const user=data.user||verifiedUser;
    const row={id:user.id,full_name:fullName,email:user.email||email,phone};
    const {error:customerError}=await client.from('Customers').upsert(row,{onConflict:'id'});
    if(customerError)console.warn('Customer profile save:',customerError.message);
    msg.textContent='Account created successfully. Opening your TDM account...';
    // If the visitor started Add to Cart before creating an account, return to the Store so product.html can restore the pending item.
    const pendingCartItem=localStorage.getItem('tdm_pending_cart_item');
    setTimeout(()=>location.href=(pendingCartItem?'product.html':'account.html'),500);
  }catch(e){msg.textContent='Could not complete signup: '+e.message}
  finally{$('finishBtn').disabled=false}
}

$('sendBtn').addEventListener('click',sendCode);
$('verifyBtn').addEventListener('click',verify);
$('resendBtn').addEventListener('click',resend);
$('finishBtn').addEventListener('click',finish);
</script></body></html>
