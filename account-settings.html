<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Account Settings | TDM</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="app-shell.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-common.js"></script><style>.settings{background:#fff;border:1px solid #d8e3f3;border-radius:20px;padding:18px;margin-top:16px}.settings input,.settings textarea{width:100%;padding:13px;box-sizing:border-box;margin:7px 0 12px}.photo{display:flex;align-items:center;gap:15px;margin-bottom:15px}.photo img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #dbeafe}.file{background:#eef6ff;padding:12px;border-radius:14px}</style></head><body><header class="tdm-app-header"><a class="tdm-brand" href="account.html"><img src="logo.png"><div><strong>TDM Manufacturing</strong><span>Account Settings</span></div></a></header><main class="app-page"><div class="app-hero"><h1>Account Settings</h1><p>Change your profile information and password.</p></div><section class="settings"><div class="photo"><img id="photo" src="logo.png"><div><b>Profile Picture</b><input id="photoFile" class="file" type="file" accept="image/*"></div></div><label>Full Name</label><input id="name"><label>Phone Number</label><input id="phone" type="tel"><label>Address</label><textarea id="address" rows="4"></textarea><label>New Password</label><input id="password" type="password" placeholder="Leave blank to keep current password"><button class="app-btn" style="width:100%" onclick="save()">Save Changes</button><p id="msg"></p></section><a class="app-btn secondary" style="margin-top:14px" href="account.html">← Account</a></main><script>const c=window.supabase.createClient(TDM_SUPABASE_URL,TDM_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let user;async function init(){const r=await c.auth.getUser();user=r.data.user;if(!user){location.href='account.html?login=required';return}const m=user.user_metadata||{};name.value=m.full_name||'';phone.value=m.phone||'';address.value=m.address||'';photo.src=m.avatar_url||localStorage.getItem('tdm_avatar_'+user.id)||'logo.png'}async function save(){msg.textContent='Saving...';let avatar=user.user_metadata?.avatar_url||localStorage.getItem('tdm_avatar_'+user.id)||'';const f=document.getElementById('photoFile').files[0];if(f){try{const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path='customers/'+user.id+'/profile-'+Date.now()+'.'+ext;const up=await c.storage.from('tdm-media').upload(path,f,{upsert:false,contentType:f.type});if(up.error)throw up.error;avatar=c.storage.from('tdm-media').getPublicUrl(path).data.publicUrl}catch(e){avatar=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});localStorage.setItem('tdm_avatar_'+user.id,avatar)}}const payload={full_name:name.value.trim(),phone:phone.value.trim(),address:address.value.trim(),avatar_url:avatar};const opts={data:payload};if(password.value.trim())opts.password=password.value.trim();const {data,error}=await c.auth.updateUser(opts);if(error){msg.textContent=error.message;return}user=data.user;photo.src=avatar||'logo.png';msg.textContent='Account updated successfully.'}init();tdmInjectNav('account');</script></body></html>
