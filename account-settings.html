<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f97316"><title>Account Settings | TDM Manufacturing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="customer-common.js"></script><style>body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:#171717;padding-bottom:80px}header{background:#fff;border-bottom:1px solid #eee;padding:10px 16px;position:sticky;top:0;z-index:5}.head{max-width:900px;margin:auto;display:flex;align-items:center;gap:10px}.head img{width:42px;height:42px;object-fit:contain}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #fed7aa;border-radius:16px;padding:16px;margin:12px 0}h1{font-size:24px}button,.btn{border:0;border-radius:12px;padding:12px 15px;background:#f97316;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #fdba74;border-radius:10px;margin:6px 0 12px;font:inherit}.muted{color:#666}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px;display:flex;justify-content:center;gap:18px;z-index:9}.nav a{text-decoration:none;color:#9a3412;font-size:12px;font-weight:700}.green{color:#15803d}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#15803d;font-weight:800;font-size:12px}.danger{color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="head"><a href="account-dashboard.html"><img src="logo.png"></a><div><b>TDM Manufacturing</b><div class="muted">Account Settings</div></div></div></header><main><div id="guard">Loading...</div><div id="content" style="display:none"><h1>⚙️ Account Settings</h1><section class="card"><label>Profile picture</label><input id="photo" type="file" accept="image/*"><img id="preview" src="logo.png" style="width:90px;height:90px;border-radius:50%;object-fit:cover"><label>Full name</label><input id="name"><label>Phone number</label><input id="phone" type="tel"><label>Home address</label><textarea id="home" rows="3"></textarea><label>Delivery address</label><textarea id="delivery" rows="3"></textarea><button onclick="saveSettings()">Save Profile</button><p id="msg"></p></section><section class="card"><h3>Change Password</h3><p class="muted">For security, a password change triggers Supabase's authenticated account update. You can also require email confirmation in Supabase Auth settings.</p><input id="newpass" type="password" placeholder="New password"><button onclick="changePassword()">Change Password</button></section></div></main><nav class="nav"><a href="account-dashboard.html">Account</a><a href="account-orders.html">Orders</a><a href="cart.html">Cart</a><a href="account-payment.html">Payment</a><a href="account-notifications.html">Notifications</a></nav><script>(async()=>{const u=await tdmRequireUser();if(!u)return;document.getElementById('guard').style.display='none';document.getElementById('content').style.display='block';try{await pageInit(u)}catch(e){document.getElementById('content').innerHTML='<div class="card">Error: '+tdmEsc(e.message)+'</div>';}})();let profileUser=null;async function pageInit(user){profileUser=user;const p=await tdmGetProfile(user);name.value=p.name==='Customer'?'':p.name;phone.value=p.phone||'';home.value=p.home_address||'';delivery.value=p.delivery_address||'';const saved=localStorage.getItem('tdm_profile_photo_'+user.id);if(saved)preview.src=saved;}async function saveSettings(){msg.textContent='Saving...';const c=tdmCustomerClient();const n=name.value.trim(),ph=phone.value.trim(),h=home.value.trim(),d=delivery.value.trim();const u=await c.auth.updateUser({data:{...(profileUser.user_metadata||{}),full_name:n,phone:ph,home_address:h,delivery_address:d,address:d}});if(u.error){msg.textContent=u.error.message;return;}const r=await c.from('Customers').upsert({id:profileUser.id,full_name:n,email:profileUser.email||'',phone:ph},{onConflict:'id'});if(r.error)console.warn(r.error);msg.textContent='Profile updated successfully.';}async function changePassword(){const p=newpass.value;if(p.length<6){msg.textContent='Password should be at least 6 characters.';return;}const r=await tdmCustomerClient().auth.updateUser({password:p});msg.textContent=r.error?'Password change failed: '+r.error.message:'Password changed successfully.';newpass.value='';}photo.addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{preview.src=r.result;localStorage.setItem('tdm_profile_photo_'+profileUser.id,r.result)};r.readAsDataURL(f);});</script></body></html>
