<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | TDM Manufacturing</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-common.js"></script>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff7ed;font-family:Arial,sans-serif;padding:20px}
    .card{width:min(430px,100%);background:#fff;border:2px solid #f97316;border-radius:24px;padding:24px;box-shadow:0 20px 50px #f9731620}
    h1{margin-top:0} input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit;margin:7px 0}
    input{border:1px solid #fdba74} button{border:0;background:#f97316;color:#fff;font-weight:900} button:disabled{opacity:.6}
    .msg{min-height:24px;margin-top:10px}
  </style>
</head>
<body>
<section class="card">
  <h1>Set a new password</h1>
  <p>Enter a new password of at least 6 characters.</p>
  <input id="pass" type="password" autocomplete="new-password" placeholder="New password">
  <input id="pass2" type="password" autocomplete="new-password" placeholder="Confirm new password">
  <button id="save" type="button">Save Password</button>
  <div id="msg" class="msg"></div>
</section>

<script>
const c = tdmAuthClient();
const pass = document.getElementById('pass');
const pass2 = document.getElementById('pass2');
const save = document.getElementById('save');
const msg = document.getElementById('msg');

let recoveryReady = false;

function showMessage(text) {
  msg.textContent = text;
}

async function prepareRecovery() {
  try {
    const { data, error } = await c.auth.getSession();
    if (error) throw error;

    if (data.session?.user) {
      recoveryReady = true;
      return;
    }

    const { data: listener } = c.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (session && session.user)) {
        recoveryReady = true;
        showMessage('');
        listener?.subscription?.unsubscribe();
      }
    });

    setTimeout(() => {
      if (!recoveryReady) {
        showMessage('This password reset link is invalid or has expired. Please request a new reset link.');
      }
    }, 2500);
  } catch (e) {
    showMessage('Unable to open password reset: ' + e.message);
  }
}

save.addEventListener('click', async () => {
  const a = pass.value;
  const b = pass2.value;

  if (a.length < 6) {
    showMessage('Password must be at least 6 characters.');
    return;
  }
  if (a !== b) {
    showMessage('Passwords do not match.');
    return;
  }

  if (!recoveryReady) {
    const { data, error } = await c.auth.getSession();
    if (error) {
      showMessage('Unable to verify reset session: ' + error.message);
      return;
    }
    if (!data.session?.user) {
      showMessage('Your reset session is not ready. Please open the latest reset email link again.');
      return;
    }
    recoveryReady = true;
  }

  save.disabled = true;
  showMessage('Saving...');

  try {
    const { error } = await c.auth.updateUser({ password: a });
    if (error) throw error;

    showMessage('Password updated successfully. You can now log in.');
    setTimeout(() => {
      location.href = 'login.html';
    }, 1500);
  } catch (e) {
    showMessage('Could not update password: ' + e.message);
    save.disabled = false;
  }
});

prepareRecovery();
</script>
</body>
</html>
