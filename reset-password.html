<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | TDM Manufacturing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-common.js"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff7ed;font-family:Arial,sans-serif;padding:20px}.card{width:min(430px,100%);background:#fff;border:2px solid #f97316;border-radius:24px;padding:24px;box-shadow:0 20px 50px #f9731620}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit;margin:7px 0}input{border:1px solid #fdba74}button{border:0;background:#f97316;color:#fff;font-weight:900}.msg{min-height:24px}</style></head><body><section class="card"><h1>Set a new password</h1><p>Enter a new password of at least 6 characters.</p><input id="pass" type="password" placeholder="New password"><input id="pass2" type="password" placeholder="Confirm new password"><button id="save">Save Password</button><div id="msg" class="msg"></div></section><script>const c=tdmAuthClient();document.getElementById('save').onclick=async()=>{const a=pass.value,b=pass2.value;if(a.length<6){msg.textContent='Password must be at least 6 characters.';return}if(a!==b){msg.textContent='Passwords do not match.';return}save.disabled=true;msg.textContent='Saving...';try{const r=await c.auth.updateUser({password:a});if(r.error)throw r.error;msg.textContent='Password updated. You can now log in.';setTimeout(()=>location.href='login.html',1200)}catch(e){msg.textContent='Could not update password: '+e.message;save.disabled=false}};</script></body></html>
