<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f97316"><title>Notifications | TDM Manufacturing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="customer-common.js"></script><style>body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:#171717;padding-bottom:80px}header{background:#fff;border-bottom:1px solid #eee;padding:10px 16px;position:sticky;top:0;z-index:5}.head{max-width:900px;margin:auto;display:flex;align-items:center;gap:10px}.head img{width:42px;height:42px;object-fit:contain}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #fed7aa;border-radius:16px;padding:16px;margin:12px 0}h1{font-size:24px}button,.btn{border:0;border-radius:12px;padding:12px 15px;background:#f97316;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #fdba74;border-radius:10px;margin:6px 0 12px;font:inherit}.muted{color:#666}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px;display:flex;justify-content:center;gap:18px;z-index:9}.nav a{text-decoration:none;color:#9a3412;font-size:12px;font-weight:700}.green{color:#15803d}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#15803d;font-weight:800;font-size:12px}.danger{color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="head"><a href="account-dashboard.html"><img src="logo.png"></a><div><b>TDM Manufacturing</b><div class="muted">Notifications</div></div></div></header><main><div id="guard">Loading...</div><div id="content" style="display:none"><h1>🔔 Notifications</h1><section class="card"><div id="notifications">Loading notifications...</div></section></div></main><nav class="nav"><a href="account-dashboard.html">Account</a><a href="account-orders.html">Orders</a><a href="cart.html">Cart</a><a href="account-payment.html">Payment</a><a href="account-notifications.html">Notifications</a></nav><script>(async()=>{const u=await tdmRequireUser();if(!u)return;document.getElementById('guard').style.display='none';document.getElementById('content').style.display='block';try{await pageInit(u)}catch(e){document.getElementById('content').innerHTML='<div class="card">Error: '+tdmEsc(e.message)+'</div>';}})();async function pageInit(user){const c=tdmCustomerClient();const r=await c.from('customer_notifications').select('id,title,message,type,is_read,created_at').eq('user_id',user.id).order('created_at',{ascending:false});if(r.error){notifications.innerHTML='<p>Notifications table is not ready. Run supabase-customer-account.sql.</p>';return;}notifications.innerHTML=r.data.length?r.data.map(n=>`<article class="card" style="background:${n.is_read?'#fff':'#f0fdf4'}"><div class="row"><b>${tdmEsc(n.title)}</b><span class="pill">${n.is_read?'Read':'New'}</span></div><p>${tdmEsc(n.message)}</p><small class="muted">${new Date(n.created_at).toLocaleString()}</small>${!n.is_read?`<br><button onclick="markRead('${n.id}')">Mark as read</button>`:''}</article>`).join(''):'No account notifications yet.';}async function markRead(id){await tdmCustomerClient().from('customer_notifications').update({is_read:true}).eq('id',id);location.reload();}</script></body></html>
