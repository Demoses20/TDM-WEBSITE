<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f97316"><title>Notifications | TDM Manufacturing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="customer-common.js"></script>
<style>
body{margin:0;background:#fff7ed;font-family:Arial,sans-serif;color:#171717;padding-bottom:80px}header{background:#fff;border-bottom:2px solid #fed7aa;padding:10px 16px;position:sticky;top:0;z-index:5}.head{max-width:900px;margin:auto;display:flex;align-items:center;gap:10px}.head img{width:42px;height:42px;object-fit:contain}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:2px solid #fed7aa;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px #f9731612}h1{font-size:24px}.muted{color:#666}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #fed7aa;padding:10px;display:flex;justify-content:center;gap:18px;z-index:9}.nav a{text-decoration:none;color:#9a3412;font-size:12px;font-weight:800}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff7ed;color:#c2410c;font-weight:800;font-size:12px}button{border:0;border-radius:12px;padding:11px 14px;background:#f97316;color:#fff;font-weight:800;cursor:pointer}
</style><link rel="stylesheet" href="customer-ui.css">
</head>
<body><header><div class="head"><a href="account-dashboard.html"><img src="logo.png" alt="TDM"></a><div><b>TDM Manufacturing</b><div class="muted">Notifications</div></div></div></header>
<main><div id="guard">Loading...</div><div id="content" style="display:none"><h1>🔔 Notifications</h1><section class="card"><div id="notifications">Loading notifications...</div></section></div></main>
<nav class="tdm-customer-nav" aria-label="Main app navigation">
  <a href="index.html"><span aria-hidden="true">⌂</span>Home</a>
  <a href="product.html"><span aria-hidden="true">▦</span>Store</a>
  <a href="cart.html"><span aria-hidden="true">🛒</span>Cart <b id="cartCountBottom" class="cart-count">0</b></a>
  <a href="service.html"><span aria-hidden="true">⚙</span>Service</a>
  <a href="account-dashboard.html"><span aria-hidden="true">♙</span>Account</a>
</nav>
<script>
const $=id=>document.getElementById(id);
(async()=>{try{const u=await tdmRequireUser('account-notifications.html');if(!u)return;$('guard').style.display='none';$('content').style.display='block';await pageInit(u);}catch(e){$('guard').style.display='none';$('content').style.display='block';$('notifications').innerHTML='<div class="card">Unable to load notifications: '+tdmEsc(e.message)+'</div>';}})();
async function loadNotifications(user){const r=await tdmCustomerClient().from('customer_notifications').select('id,title,message,type,is_read,created_at').eq('user_id',user.id).order('created_at',{ascending:false});if(!r.error)render(r.data||[]);return r;}
async function pageInit(user){
  const c=tdmCustomerClient();
  const r=await c.from('customer_notifications').select('id,title,message,type,is_read,created_at').eq('user_id',user.id).order('created_at',{ascending:false});
  if(r.error){$('notifications').innerHTML='<p><b>Notifications are not connected yet.</b></p><p class="muted">Run <b>SUPABASE-V12.2-ACCOUNT-NOTIFICATION-PROFILE-FIX.sql</b> in Supabase SQL Editor, then refresh this page.</p><p class="muted">Database message: '+tdmEsc(r.error.message)+'</p>';return;}
  render(r.data||[]);
  setInterval(()=>loadNotifications(user),15000); c.channel('tdm-customer-notifications-'+user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'customer_notifications',filter:'user_id=eq.'+user.id},payload=>{const n=payload.new;const el=document.createElement('article');el.className='card';el.innerHTML=notificationHtml(n);$('notifications').prepend(el);}).subscribe();
}
function notificationHtml(n){return `<div class="row"><b>${tdmEsc(n.title)}</b><span class="pill">${n.is_read?'Read':'New'}</span></div><p>${tdmEsc(n.message)}</p><small class="muted">${new Date(n.created_at).toLocaleString()}</small>${!n.is_read?`<br><br><button onclick="markRead('${n.id}',this)">Mark as read</button>`:''}`;}
function render(rows){$('notifications').innerHTML=rows.length?rows.map(n=>`<article class="card">${notificationHtml(n)}</article>`).join(''):'No account notifications yet.';}
async function markRead(id,button){button.disabled=true;const r=await tdmCustomerClient().from('customer_notifications').update({is_read:true}).eq('id',id);if(r.error){button.disabled=false;return}location.reload();}
</script></body></html>
