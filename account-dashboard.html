<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f97316"><title>TDM Customer Account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="customer-common.js"></script><style>
body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:#171717;padding-bottom:86px}.wrap{max-width:900px;margin:auto;padding:16px}header{background:#fff;border-bottom:1px solid #eee;padding:10px 16px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#111}.brand img{width:45px;height:45px;object-fit:contain;border-radius:10px}.profile{background:#fff;border-radius:18px;padding:18px;margin:14px 0;display:flex;gap:15px;align-items:center;box-shadow:0 2px 12px #0000000b}.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#eee}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.tile{background:#fff;border:1px solid #fed7aa;border-radius:15px;padding:16px;text-decoration:none;color:#9a3412;font-weight:800;min-height:72px}.tile span{display:block;font-size:25px;margin-bottom:8px}.tile small{font-weight:500;color:#666}.logout{margin-top:15px;width:100%;padding:14px;border:0;border-radius:13px;background:#111;color:#fff;font-weight:800}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:70px;background:#fff;border-top:1px solid #ddd;z-index:9999;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px #00000012}
.bottom-nav a{position:relative;flex:1;max-width:180px;text-align:center;padding:8px 3px 5px;color:#777;font-size:10px;text-decoration:none;font-weight:600}
.bottom-nav a span{display:block;font-size:20px;line-height:23px;margin-bottom:2px}
.bottom-nav a.active,.bottom-nav a:hover{color:#111}
.bottom-nav .cart-count{display:inline-flex;min-width:18px;height:18px;align-items:center;justify-content:center;border-radius:999px;background:#111;color:#fff;font-size:10px;padding:0 5px;position:absolute;top:3px;margin-left:-2px}
</style><link rel="stylesheet" href="customer-ui.css">
</head><body><header><a class="brand" href="index.html"><img src="logo.png"><div><b>TDM Manufacturing</b><small style="display:block;color:#9a3412">Customer Account</small></div></a></header><main class="wrap"><div id="loading">Loading account...</div><div id="app" style="display:none"><section class="profile"><img id="avatar" class="avatar" src="logo.png"><div><h2 id="name" style="margin:0 0 5px"></h2><div id="email" style="color:#666"></div><div id="phone" style="color:#666"></div></div></section><div class="grid"><a class="tile" href="account-about.html"><span>ℹ️</span>About<small>Learn about TDM</small></a><a class="tile" href="account-orders.html"><span>📦</span>My Orders<small>Track orders</small></a><a class="tile" href="cart.html"><span>🛒</span>My Cart<small>Review & checkout</small></a><a class="tile" href="account-affiliate.html"><span>🤝</span>Affiliate Marketing<small>Products, links & rewards</small></a><a class="tile" href="account-settings.html"><span>⚙️</span>Settings<small>Profile & security</small></a><a class="tile" href="account-payment.html"><span>💳</span>Payment<small>Pay & saved methods</small></a><a class="tile" href="account-notifications.html"><span>🔔</span>Notifications<small>Account messages</small></a></div><button class="logout" onclick="tdmSignOut()">Log Out</button></div></main>
<nav class="tdm-customer-nav" aria-label="Main app navigation">
  <a href="index.html"><span>⌂</span>Home</a>
  <a href="product.html"><span>▦</span>Store</a>
  <a href="cart.html"><span>🛒</span>Cart <b id="cartCountBottom" class="cart-count">0</b></a>
  <a href="service.html"><span>⚙</span>Service</a>
  <a href="account-dashboard.html"><span>♙</span>Account</a>
</nav>
<script>
(async()=>{try{const u=await tdmRequireUser();if(!u)return;const p=await tdmGetProfile(u);document.getElementById('name').textContent='Welcome, '+p.name+' 👋';document.getElementById('email').textContent=p.email;document.getElementById('phone').textContent=p.phone||'Phone not provided';if(p.avatar_url)document.getElementById('avatar').src=p.avatar_url;document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block';await tdmUpdateCartBadges();}catch(e){document.getElementById('loading').textContent='Unable to load account: '+e.message;}})();
</script></body></html>
