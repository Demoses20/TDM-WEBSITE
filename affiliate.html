<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Affiliate Marketing | TDM</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="app-shell.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-common.js"></script><style>input{width:100%;padding:13px;box-sizing:border-box;margin:7px 0;border:1px solid #d8e3f3;border-radius:12px}</style></head><body><header class="tdm-app-header"><a class="tdm-brand" href="account.html"><img src="logo.png"><div><strong>TDM Manufacturing</strong><span>Affiliate Marketing</span></div></a></header><main class="app-page"><div class="app-hero"><h1>Affiliate Marketing</h1><p>Join and manage your TDM referral program directly inside the app.</p></div><div class="app-card" style="margin-top:16px"><div id="status">Checking...</div><div id="tools" style="display:none"><label>Referral Code</label><input id="code" readonly><button class="app-btn secondary" onclick="copy('code')">Copy Code</button><label>Referral Link</label><input id="link" readonly><button class="app-btn" onclick="copy('link')">Copy Link</button><button class="app-btn" style="margin-top:10px" onclick="share()">Share My Link</button><p>New customers who use your link can register through the app. No WhatsApp is required.</p></div><button id="join" class="app-btn" onclick="join()">Join Affiliate Program</button></div><a class="app-btn secondary" style="margin-top:14px" href="account.html">← Account</a></main><script>const c=window.supabase.createClient(TDM_SUPABASE_URL,TDM_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let user;async function init(){const r=await c.auth.getUser();user=r.data.user;if(!user){location.href='account.html?login=required';return}const joined=!!user.user_metadata?.affiliate_joined;if(joined)render();else{status.textContent='You have not joined the affiliate program yet.'}}function code(){return 'TDM-'+user.id.replace(/-/g,'').slice(0,8).toUpperCase()}function render(){status.textContent='You are an active TDM affiliate.';join.style.display='none';tools.style.display='block';const x=code();document.getElementById('code').value=x;document.getElementById('link').value=location.origin+'/TDM-WEBSITE/account.html?ref='+encodeURIComponent(x)}async function join(){const {data,error}=await c.auth.updateUser({data:{affiliate_joined:true,affiliate_joined_at:new Date().toISOString()}});if(error){status.textContent=error.message;return}user=data.user;render()}async function copy(id){await navigator.clipboard.writeText(document.getElementById(id).value);alert('Copied')}async function share(){const url=document.getElementById('link').value;if(navigator.share)await navigator.share({title:'TDM Manufacturing',text:'Join TDM through my referral link',url});else copy('link')}init();tdmInjectNav('account');</script></body></html>
