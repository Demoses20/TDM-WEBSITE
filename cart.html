<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json"><title>TDM Manufacturing | Cart</title><style>
.app-topbar{position:sticky;top:0;z-index:100;background:#111;color:#fff;border-bottom:1px solid #2a2a2a;box-shadow:0 2px 12px #0002}
.app-nav{max-width:1100px;margin:auto;display:flex;align-items:stretch;justify-content:space-around;min-height:58px}
.app-nav-link{position:relative;flex:1;max-width:180px;text-align:center;padding:8px 5px 6px;color:#bbb;font-size:12px;text-decoration:none;font-weight:600}
.app-nav-link span{display:block;font-size:20px;line-height:22px;margin-bottom:2px}.app-nav-link:hover,.app-nav-link.active{color:#fff}.cart-count{display:inline-flex;min-width:18px;height:18px;align-items:center;justify-content:center;border-radius:999px;background:#fff;color:#111;font-size:10px;padding:0 5px;margin-left:2px;vertical-align:middle}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid #ddd;z-index:100;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.bottom-nav a{position:relative;flex:1;max-width:180px;text-align:center;padding:9px 3px 6px;color:#777;font-size:10px;text-decoration:none;font-weight:600}.bottom-nav a span{display:block;font-size:20px;line-height:23px;margin-bottom:2px}.bottom-nav a:hover,.bottom-nav a.active{color:#111}.bottom-nav .cart-count{background:#111;color:#fff;position:absolute;top:4px;margin-left:-2px}.app-spacer{height:76px}
@media(max-width:520px){.app-nav-link{font-size:10px}.app-nav-link span{font-size:18px}.bottom-nav a{font-size:9px}}
</style><style>body{margin:0;background:#f5f6f8;font-family:Arial,sans-serif;color:#171717;padding-bottom:90px}.wrap{max-width:900px;margin:auto;padding:24px 16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.head h1{margin:0}.cart-item{background:#fff;border:1px solid #e5e5e5;border-radius:15px;padding:13px;display:grid;grid-template-columns:80px 1fr auto;gap:13px;align-items:center;margin-bottom:10px}.cart-item img{width:80px;height:70px;object-fit:contain;border-radius:10px;background:#f1f1f1}.cart-item h3{margin:0 0 5px;font-size:16px}.cart-item p{margin:0;color:#666;font-size:13px}.qty{display:flex;align-items:center;gap:8px;margin-top:8px}.qty button{width:30px;height:30px;border:1px solid #ddd;background:#fff;border-radius:8px}.remove{border:0;background:transparent;color:#b00020}.summary{background:#111;color:#fff;border-radius:16px;padding:18px;margin-top:18px}.summary-row{display:flex;justify-content:space-between;margin:8px 0}.checkout{display:block;text-align:center;background:#fff;color:#111;border-radius:10px;padding:12px;margin-top:14px;font-weight:700;text-decoration:none}.empty{background:#fff;border-radius:16px;padding:45px 20px;text-align:center;color:#666}.continue{display:inline-block;margin-top:12px;background:#111;color:#fff;padding:11px 15px;border-radius:9px;text-decoration:none}</style></head><body><header class="app-topbar"><div class="app-nav"><a class="app-nav-link" href="index.html"><span>⌂</span>Home</a><a class="app-nav-link" href="product.html"><span>▦</span>Store</a><a class="app-nav-link" href="service.html"><span>⚙</span>Services</a><a class="app-nav-link" href="account.html"><span>♙</span>Account</a><a class="app-nav-link cart-link" href="cart.html"><span>🛒</span>Cart <b id="cartCountTop" class="cart-count">0</b></a></div></header><main class="wrap"><div class="head"><h1>My Cart</h1><a href="product.html">Continue shopping</a></div><div id="cartItems"></div><div id="summary"></div></main><nav class="bottom-nav" aria-label="App navigation"><a href="index.html"><span>⌂</span>Home</a><a href="product.html"><span>▦</span>Store</a><a href="service.html"><span>⚙</span>Services</a><a href="account.html"><span>♙</span>Account</a><a href="cart.html"><span>🛒</span>Cart <b id="cartCountBottom" class="cart-count">0</b></a></nav><script>
(function(){
  function getCart(){try{return JSON.parse(localStorage.getItem('tdm_cart')||'[]')}catch(e){return []}}
  function updateCartBadges(){const n=getCart().reduce((s,i)=>s+(Number(i.quantity)||0),0);document.querySelectorAll('#cartCountTop,#cartCountBottom').forEach(x=>x.textContent=n)}
  window.tdmCart=getCart; window.updateTdmCart=updateCartBadges;
  updateCartBadges();
  window.addEventListener('storage',updateCartBadges);
})();

const money=v=>`₦ ${Number(v||0).toLocaleString()}`;function cart(){try{return JSON.parse(localStorage.getItem('tdm_cart')||'[]')}catch(e){return[]}}function save(c){localStorage.setItem('tdm_cart',JSON.stringify(c));updateCartBadges();render()}function addSample(){ }function render(){const c=cart(),el=document.getElementById('cartItems'),sum=document.getElementById('summary');if(!c.length){el.innerHTML='<div class="empty">Your cart is empty.<br><a class="continue" href="product.html">Browse Store</a></div>';sum.innerHTML='';return}let total=0;el.innerHTML=c.map((i,n)=>{const q=Number(i.quantity)||1;const price=Number(i.price)||0;total+=price*q;return `<div class="cart-item"><img src="${i.image||'logo.png'}" alt=""><div><h3>${i.name||'TDM Equipment'}</h3><p>${price?money(price):'Request quote'}</p><div class="qty"><button onclick="changeQty(${n},-1)">−</button><b>${q}</b><button onclick="changeQty(${n},1)">+</button><button class="remove" onclick="removeItem(${n})">Remove</button></div></div><b>${price?money(price*q):'Quote'}</b></div>`}).join('');sum.innerHTML=`<div class="summary"><div class="summary-row"><span>Items</span><b>${c.reduce((a,i)=>a+(Number(i.quantity)||0),0)}</b></div><div class="summary-row"><span>Total</span><b>${money(total)}</b></div><a class="checkout" href="https://wa.me/2347049087007?text=${encodeURIComponent('Hello TDM Manufacturing, I would like to request a quotation for the items in my cart: '+c.map(i=>(i.name||'Item')+' x'+(i.quantity||1)).join(', '))}" target="_blank" rel="noopener">Request Quote on WhatsApp</a></div>`}function changeQty(i,d){const c=cart();c[i].quantity=Math.max(1,(Number(c[i].quantity)||1)+d);save(c)}function removeItem(i){const c=cart();c.splice(i,1);save(c)}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});</script></body></html>
