<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><title>TDM Customer Account</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="app-shell.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-common.js"></script><style>
body{margin:0;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 16px}.auth,.dash{background:rgba(255,255,255,.96);border:1px solid #fed7aa;border-radius:24px;box-shadow:0 12px 35px rgba(16,24,40,.09);padding:22px}.auth h1,.dash h1{margin-top:0}.auth input,.settings input,.settings textarea{width:100%;padding:13px;margin:7px 0;box-sizing:border-box}.auth button,.settings button{width:100%;padding:13px;margin-top:9px}.profile{display:flex;gap:16px;align-items:center;padding:16px;border-radius:20px;background:linear-gradient(135deg,#431407,#ea580c);color:#fff}.profile img{width:82px;height:82px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.8);background:#fff}.profile h2{margin:0 0 5px}.profile p{margin:0;color:#ffedd5}.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.menu-card{display:flex;align-items:center;gap:13px;min-height:88px;padding:16px;border:1px solid #fed7aa;border-radius:18px;background:linear-gradient(145deg,#fff,#fffaf5);text-decoration:none;color:#101828;box-shadow:0 8px 20px rgba(16,24,40,.06);font-weight:900}.menu-icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:15px;color:#fff;background:linear-gradient(135deg,#f97316,#c2410c);font-size:24px;flex:0 0 auto}.info{margin-top:16px;padding:15px;border-radius:18px;background:#eef6ff;border:1px solid #fed7aa}.logout{margin-top:18px;width:100%;padding:13px;border:0;border-radius:13px;background:#101828;color:#fff;font-weight:900}@media(max-width:520px){.menu-grid{grid-template-columns:1fr}.profile img{width:70px;height:70px}}
</style></head><body><header class="tdm-app-header"><a class="tdm-brand" href="index.html"><img src="logo.png" alt="TDM Manufacturing logo"><div><strong>TDM Manufacturing</strong><span>Precision Engineering &amp; Fabricated Equipment</span></div></a></header>
<main class="wrap"><div id="authBox" class="auth"><h1>Customer Account</h1><p>Log in to your TDM customer account or create one.</p><input id="fullName" placeholder="Full name"><input id="email" type="email" placeholder="Email address"><input id="phone" type="tel" placeholder="Phone number"><input id="password" type="password" placeholder="Password"><input id="address" placeholder="Address (optional)"><button class="app-btn" onclick="signUp()">Create Account</button><button class="app-btn secondary" onclick="logIn()">Log In</button><p id="message"></p></div>
<div id="dash" class="dash" style="display:none"><div class="profile"><img id="profilePic" src="logo.png" alt="Profile picture"><div><h2 id="welcome">Welcome</h2><p id="emailText"></p></div></div><div class="info"><b>Customer Information</b><div id="phoneText"></div><div id="addressText"></div></div><div class="menu-grid"><a class="menu-card" href="account-about.html"><span class="menu-icon">ℹ</span><span>About</span></a><a class="menu-card" href="account-orders.html"><span class="menu-icon">📦</span><span>My Orders</span></a><a class="menu-card" href="payment.html"><span class="menu-icon">₦</span><span>Payment Center</span></a><a class="menu-card" href="affiliate.html"><span class="menu-icon">🤝</span><span>Affiliate Marketing</span></a><a class="menu-card" href="account-settings.html"><span class="menu-icon">⚙</span><span>Account Settings</span></a><a class="menu-card" href="cart.html"><span class="menu-icon">🛒</span><span>My Cart</span></a></div><button class="logout" onclick="logOut()">Log Out</button></div></main><script>
const client=window.supabase.createClient(TDM_SUPABASE_URL,TDM_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});window.tdmSupabaseClient=client;
const qs=new URLSearchParams(location.search);if(qs.get('login')==='required')document.getElementById('message').textContent='Please log in to continue.';
async function signUp(){const fullName=fullNameEl.value.trim(),email=emailEl.value.trim(),phone=phoneEl.value.trim(),password=passwordEl.value,address=addressEl.value.trim();if(!fullName||!email||!phone||!password){message.textContent='Please fill in name, email, phone and password.';return}message.textContent='Creating account...';const {error}=await client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name:fullName,phone,address}}});message.textContent=error?error.message:'Account created. Check your email to confirm your account.'}
async function logIn(){const email=emailEl.value.trim(),password=passwordEl.value;if(!email||!password){message.textContent='Enter email and password.';return}message.textContent='Logging in...';const {data,error}=await client.auth.signInWithPassword({email,password});if(error){message.textContent=error.message;return}await showUser(data.user);const ret=sessionStorage.getItem('tdm_return_after_login');if(ret){sessionStorage.removeItem('tdm_return_after_login');setTimeout(()=>location.href=ret,350)}}
async function showUser(user){authBox.style.display='none';dash.style.display='block';const m=user.user_metadata||{};welcome.textContent='Welcome, '+(m.full_name||user.email||'Customer');emailText.textContent=user.email||'';phoneText.textContent='Phone: '+(m.phone||'Not provided');addressText.textContent='Address: '+(m.address||'Not provided');profilePic.src=m.avatar_url||localStorage.getItem('tdm_avatar_'+user.id)||'logo.png'}
async function logOut(){await client.auth.signOut();location.reload()}
const fullNameEl=document.getElementById('fullName'),emailEl=document.getElementById('email'),phoneEl=document.getElementById('phone'),passwordEl=document.getElementById('password'),addressEl=document.getElementById('address'),message=document.getElementById('message'),authBox=document.getElementById('authBox'),dash=document.getElementById('dash'),welcome=document.getElementById('welcome'),emailText=document.getElementById('emailText'),phoneText=document.getElementById('phoneText'),addressText=document.getElementById('addressText'),profilePic=document.getElementById('profilePic');
client.auth.getUser().then(({data})=>{if(data.user)showUser(data.user)});tdmInjectNav('account');
</script></body></html>
