<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Product | TDM Manufacturing</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="app-shell.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-common.js"></script><style>.detail{max-width:1050px;margin:auto;padding:20px 16px}.media-main{background:linear-gradient(145deg,#eaf2ff,#fff);border-radius:22px;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden}.media-main img,.media-main video{width:100%;max-height:520px;object-fit:contain}.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px}.thumb{width:76px;height:64px;border:2px solid #d8e3f3;border-radius:10px;overflow:hidden;background:#fff;flex:0 0 auto;cursor:pointer}.thumb.active{border-color:#2563eb}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.info{margin-top:16px;background:#fff;border:1px solid #d8e3f3;border-radius:20px;padding:20px;box-shadow:0 10px 28px rgba(16,24,40,.08)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.back{margin-bottom:12px;display:inline-flex}.description{white-space:pre-wrap;line-height:1.7;color:#475467}@media(max-width:520px){.media-main{min-height:230px}.actions{grid-template-columns:1fr}}</style></head><body><header class="tdm-app-header"><a class="tdm-brand" href="product.html"><img src="logo.png"><div><strong>TDM Manufacturing</strong><span>Store Product</span></div></a></header><main class="detail"><a class="app-btn secondary back" href="product.html">← Back to Store</a><div id="content" class="app-card">Loading product...</div></main><script>
const c=window.supabase.createClient(TDM_SUPABASE_URL,TDM_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let product,media=[],current=0;function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function money(p){return p.price==null||p.price===''?'Request quote':`${p.currency||'₦'} ${Number(p.price).toLocaleString()}`}function render(){const m=media[current];const main=m?.type?.startsWith('video/')?`<video src="${esc(m.url)}" controls playsinline></video>`:`<img src="${esc(m?.url||'logo.png')}" alt="${esc(product.name)}">`;content.innerHTML=`<div class="media-main">${main}</div><div class="thumbs">${media.map((x,i)=>`<button class="thumb ${i===current?'active':''}" onclick="current=${i};render()">${x.type?.startsWith('video/')?'<video src="'+esc(x.url)+'"></video>':'<img src="'+esc(x.url)+'">'}</button>`).join('')}</div><div class="info"><span class="badge">${esc(product.category||'Equipment')}</span><h1>${esc(product.name)}</h1><h2 style="color:#155eef">${money(product)}</h2><p class="description">${esc(product.description||product.short_description||'No additional description has been provided yet.')}</p><p><b>${product.stock_quantity!=null?'Stock: '+esc(product.stock_quantity):'Made to order'}</b></p><div class="actions"><button class="app-btn" onclick="addCart()">🛒 Add to Cart</button><a class="app-btn secondary" target="_blank" href="https://wa.me/2347049087007?text=${encodeURIComponent('Hello TDM Manufacturing, I am interested in '+product.name+'.')}">Contact Us</a></div></div>`}
async function addCart(){const {data:{user}}=await c.auth.getUser();if(!user){sessionStorage.setItem('tdm_return_after_login',location.href);location.href='account.html?login=required';return}const cart=tdmReadCart(user.id),found=cart.find(x=>x.product_id===product.id);if(found)found.quantity=(Number(found.quantity)||1)+1;else cart.push({product_id:product.id,name:product.name,price:Number(product.price)||0,image:media[0]?.url||'logo.png',quantity:1});tdmWriteCart(cart,user.id);alert('Added to your cart.')}
async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){content.innerHTML='<p>Product not found.</p>';return}const {data,error}=await c.from('products').select('*').eq('id',id).single();if(error||!data){content.innerHTML='<p>Product not found.</p>';return}product=data;media=tdmParseMedia(product).map(url=>typeof url==='string'?{url,type:url.match(/\.(mp4|webm|mov)(\?|$)/i)?'video/mp4':'image/*'}:url);if(!media.length)media=[{url:'logo.png',type:'image/*'}];render()}load();tdmInjectNav('store');</script></body></html>
