<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TDM Manufacturing • Customer Access</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#f97316">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-common.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(145deg,#fff7ed 0%,#ffedd5 45%,#fff 100%);color:#111827;display:flex;align-items:center;justify-content:center;padding:22px}.auth-shell{width:min(430px,100%)}.brand-card{background:#fff;border:2px solid #f97316;border-radius:30px;padding:28px 24px 22px;text-align:center;box-shadow:0 20px 50px rgba(249,115,22,.18)}.logo-wrap{width:118px;height:118px;margin:0 auto 18px;border-radius:30px;padding:8px;background:linear-gradient(145deg,#f97316,#fb923c);box-shadow:0 12px 28px rgba(249,115,22,.3)}.logo-wrap img{width:100%;height:100%;object-fit:contain;border-radius:23px;background:#111}.brand-card h1{margin:0;font-size:28px}.brand-card .tag{margin:8px 0 25px;color:#6b7280;line-height:1.45}.auth-buttons{display:grid;gap:13px}.auth-btn{display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:18px;border:2px solid #f97316;text-decoration:none;font-weight:900;font-size:17px;transition:.18s}.auth-btn.primary{background:#f97316;color:#fff;box-shadow:0 9px 20px rgba(249,115,22,.25)}.auth-btn.secondary{background:#fff;color:#c2410c}.auth-btn:active{transform:scale(.98)}.small{margin-top:20px;font-size:12px;color:#6b7280}.back{display:inline-block;margin-top:15px;color:#c2410c;font-weight:800;text-decoration:none}
</style></head><body>
<main class="auth-shell"><section class="brand-card"><div class="logo-wrap"><img src="logo.png" alt="TDM Manufacturing logo"></div><h1>Welcome to TDM</h1><p class="tag">Your TDM Manufacturing customer account. Sign in to shop, manage orders, payments and your account.</p><div class="auth-buttons"><a class="auth-btn primary" href="login.html">🔐 Log In</a><a class="auth-btn secondary" href="signup.html">✨ Create Account</a></div><p class="small">Secure customer access powered by TDM Manufacturing.</p><a class="back" href="index.html">← Back to Store</a></section></main>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});</script>
