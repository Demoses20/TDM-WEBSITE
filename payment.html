<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f97316"><title>Payment Center | TDM</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="app-shell.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-common.js"></script><style>.pay{background:#fff;border:1px solid #fed7aa;border-radius:20px;padding:18px;margin-top:16px}.total{font-size:28px;font-weight:900;color:#ea580c}.method{padding:14px;border-radius:16px;background:#eef6ff;border:1px solid #fed7aa;margin:12px 0}</style></head><body><header class="tdm-app-header"><a class="tdm-brand" href="account.html"><img src="logo.png"><div><strong>TDM Manufacturing</strong><span>Payment Center</span></div></a></header><main class="app-page"><div class="app-hero"><h1>Payment Center</h1><p>Review your cart and prepare payment without leaving the TDM app.</p></div><div class="pay"><h2>Current Cart Total</h2><div id="total" class="total">₦0</div><div id="items"></div><div class="method"><b>Bank Transfer</b><p>Business payment details can be configured here before launch. Keep your transfer receipt for order verification.</p></div><a class="app-btn" href="cart.html">Open My Cart</a></div><a class="app-btn secondary" style="margin-top:14px" href="account.html">← Account</a></main><script>async function load(){const {data:{user}}=await window.tdmSupabaseClient.auth.getUser();if(!user){location.href='account.html?login=required';return}const c=tdmReadCart(user.id);let total=0;items.innerHTML=c.map(i=>{const q=Number(i.quantity)||1;const p=Number(i.price)||0;total+=q*p;return `<p>${esc(i.name)} × ${q} — ₦${(q*p).toLocaleString()}</p>`}).join('')||'<p>Your cart is empty.</p>';document.getElementById('total').textContent='₦'+total.toLocaleString()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.tdmSupabaseClient=window.supabase.createClient(TDM_SUPABASE_URL,TDM_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});load();tdmInjectNav('account');</script></body></html>
