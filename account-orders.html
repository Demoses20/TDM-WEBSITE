<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#f97316"
>

<title>My Orders | TDM Manufacturing</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="customer-common.js"></script>

<link rel="stylesheet" href="customer-ui.css">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f7f7;
  font-family:Arial,sans-serif;
  color:#171717;
  padding-bottom:86px;
}

header{
  background:#fff;
  border-bottom:1px solid #eee;
  padding:10px 16px;
  position:sticky;
  top:0;
  z-index:5;
}

.head{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.head a{
  display:flex;
  align-items:center;
}

.head img{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:9px;
}

main{
  max-width:900px;
  margin:auto;
  padding:16px;
}

h1{
  font-size:24px;
  margin:8px 0 18px;
}

.card{
  background:#fff;
  border:1px solid #fed7aa;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 2px 10px #00000008;
}

button,
.btn{
  border:0;
  border-radius:12px;
  padding:12px 15px;
  background:#f97316;
  color:#fff;
  font-weight:800;
  text-decoration:none;
  cursor:pointer;
}

.muted{
  color:#666;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.order-title{
  margin:0;
  font-size:18px;
  line-height:1.35;
}

.order-info{
  margin:8px 0;
  line-height:1.5;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#dcfce7;
  color:#15803d;
  font-weight:800;
  font-size:12px;
  white-space:nowrap;
}

.status-line{
  margin-top:15px;
  line-height:1.5;
}

.status-step{
  display:inline-block;
  padding:5px 9px;
  margin:3px;
  border-radius:999px;
  background:#dcfce7;
  color:#15803d;
  font-weight:800;
  font-size:12px;
}

.status-step.inactive{
  opacity:.25;
}

.green{
  color:#15803d;
}

.empty{
  text-align:center;
  padding:30px 18px;
}

.empty-icon{
  font-size:42px;
  margin-bottom:10px;
}

.error{
  color:#b91c1c;
}

.loading{
  text-align:center;
  padding:25px;
}

.order-date{
  color:#666;
  font-size:13px;
}

/* Bottom navigation */

.tdm-customer-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  z-index:9999;
  display:flex;
  justify-content:center;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 12px #00000012;
}

.tdm-customer-nav a{
  position:relative;
  flex:1;
  max-width:180px;
  text-align:center;
  padding:8px 3px 5px;
  color:#777;
  font-size:10px;
  text-decoration:none;
  font-weight:600;
}

.tdm-customer-nav a span{
  display:block;
  font-size:20px;
  line-height:23px;
  margin-bottom:2px;
}

.tdm-customer-nav a.active,
.tdm-customer-nav a:hover{
  color:#111;
}

.tdm-customer-nav .cart-count{
  display:inline-flex;
  min-width:18px;
  height:18px;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:#111;
  color:#fff;
  font-size:10px;
  padding:0 5px;
  position:absolute;
  top:3px;
  margin-left:-2px;
}

@media(max-width:560px){

  .row{
    align-items:flex-start;
  }

  .order-title{
    font-size:16px;
  }

}

</style>

</head>


<body>


<header>

  <div class="head">

    <a href="account-dashboard.html">

      <img
        src="logo.png"
        alt="TDM Manufacturing"
      >

    </a>

    <div>

      <b>TDM Manufacturing</b>

      <div class="muted">
        My Orders
      </div>

    </div>

  </div>

</header>


<main>

  <div
    id="guard"
    class="card loading"
  >
    Loading your orders...
  </div>


  <div
    id="content"
    style="display:none"
  >

    <h1>📦 My Orders</h1>

    <div id="orders"></div>

  </div>

</main>


<nav
  class="tdm-customer-nav"
  aria-label="Main app navigation"
>

  <a href="index.html">

    <span aria-hidden="true">
      ⌂
    </span>

    Home

  </a>


  <a href="product.html">

    <span aria-hidden="true">
      ▦
    </span>

    Store

  </a>


  <a href="cart.html">

    <span aria-hidden="true">
      🛒
    </span>

    Cart

    <b
      id="cartCountBottom"
      class="cart-count"
    >
      0
    </b>

  </a>


  <a href="service.html">

    <span aria-hidden="true">
      ⚙
    </span>

    Service

  </a>


  <a
    href="account-dashboard.html"
    class="active"
  >

    <span aria-hidden="true">
      ♙
    </span>

    Account

  </a>

</nav>


<script>

(async function(){

  const guard =
    document.getElementById("guard");

  const content =
    document.getElementById("content");

  try{

    /*
      Require an authenticated customer.
      customer-common.js handles the redirect
      to auth.html when no session exists.
    */

    const user =
      await tdmRequireUser("account-orders.html");

    if(!user){
      return;
    }


    /*
      Update the cart badge.
    */

    await tdmUpdateCartBadges();


    /*
      Show the orders page.
    */

    guard.style.display =
      "none";

    content.style.display =
      "block";


    /*
      Load orders.
    */

    await loadOrders(user);


  }catch(error){

    console.error(
      "TDM orders error:",
      error
    );

    guard.className =
      "card error";

    guard.textContent =
      "Unable to load your orders: " +
      (error.message || "Please try again.");

  }

})();


async function loadOrders(user){

  const ordersContainer =
    document.getElementById("orders");

  const client =
    tdmCustomerClient();


  const result =
    await client
      .from("Orders")
      .select(
        "id,product_name,quantity,total_amount,status,created_at,shipping_address,shipping_city,shipping_state,shipping_country,payment_status,tracking_number"
      )
      .eq(
        "user_id",
        user.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    throw result.error;

  }


  const orders =
    Array.isArray(result.data)
      ? result.data
      : [];


  /*
    No orders.
  */

  if(!orders.length){

    ordersContainer.innerHTML = `

      <div class="card empty">

        <div class="empty-icon">
          📦
        </div>

        <h3>
          You have no orders yet
        </h3>

        <p class="muted">
          Your TDM orders will appear here
          after you place an order.
        </p>

        <a
          href="product.html"
          class="btn"
        >
          Visit TDM Store
        </a>

      </div>

    `;

    return;

  }


  /*
    Order progress stages.
  */

  const steps = [
    "Confirmed",
    "Processing",
    "Ready",
    "Shipped",
    "Delivered"
  ];


  ordersContainer.innerHTML =
    orders.map(function(order){

      const status =
        String(
          order.status || "Received"
        );


      const statusIndex =
        steps.findIndex(function(step){

          return (
            step.toLowerCase() ===
            status.toLowerCase()
          );

        });


      const progress =
        steps.map(function(step,index){

          const active =
            index <= statusIndex;

          return `

            <span
              class="status-step ${active ? "" : "inactive"}"
            >
              ${tdmEsc(step)}
            </span>

          `;

        }).join("");


      const deliveryAddress =
        [
          order.shipping_address,
          order.shipping_city,
          order.shipping_state,
          order.shipping_country
        ]
        .filter(Boolean)
        .join(", ");


      let orderDate =
        "Date not available";


      if(order.created_at){

        const parsedDate =
          new Date(order.created_at);

        if(!isNaN(parsedDate.getTime())){

          orderDate =
            parsedDate.toLocaleString();

        }

      }


      return `

        <section class="card">

          <div class="row">

            <h3 class="order-title">

              ${tdmEsc(
                order.product_name ||
                "TDM Order"
              )}

            </h3>

            <span class="pill">

              ${tdmEsc(status)}

            </span>

          </div>


          <p class="order-info">

            Quantity:
            <b>
              ${Number(order.quantity || 0)}
            </b>

          </p>


          <p class="order-info">

            Amount:
            <b>
              ${tdmEsc(
                tdmMoney(order.total_amount)
              )}
            </b>

          </p>


          <p class="order-info">

            Delivery:
            <b>

              ${tdmEsc(
                deliveryAddress ||
                "Address not recorded"
              )}

            </b>

          </p>


          <p class="order-info">

            Tracking number:
            <b>

              ${tdmEsc(
                order.tracking_number ||
                "Not assigned yet"
              )}

            </b>

          </p>


          <p class="order-info">

            Payment:
            <b>

              ${tdmEsc(
                order.payment_status ||
                "unpaid"
              )}

            </b>

          </p>


          <p class="order-date">

            Order date:
            ${tdmEsc(orderDate)}

          </p>


          <div class="status-line">

            ${progress}

          </div>


          <p class="green">

            <b>● ${tdmEsc(status)}</b>

            — TDM order status is shown here
            as it changes.

          </p>

        </section>

      `;

    }).join("");


  /*
    Listen for changes to this customer's orders.
    Reload only when the database changes.
  */

  try{

    client
      .channel(
        "tdm-orders-" + user.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"Orders",
          filter:"user_id=eq." + user.id
        },
        function(){

          location.reload();

        }
      )
      .subscribe();

  }catch(error){

    console.warn(
      "TDM order realtime subscription unavailable:",
      error
    );

  }

}

</script>


</body>
</html>
