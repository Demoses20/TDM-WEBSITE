<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>My Orders | TDM</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="app-shell.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-common.js"></script><style>.order{background:#fff;border:1px solid #d8e3f3;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 22px rgba(16,24,40,.06)}.order strong{color:#164eaa}.status{display:inline-block;padding:6px 10px;border-radius:999px;background:#eaf2ff;color:#155eef;font-weight:800;font-size:12px}</style></head><body><header class="tdm-app-header"><a class="tdm-brand" href="account.html"><img src="logo.png"><div><strong>TDM Manufacturing</strong><span>My Orders</span></div></a></header><main class="app-page"><div class="app-hero"><h1>My Orders</h1><p>Track orders connected to your customer account.</p></div><div id="orders" class="app-card" style="margin-top:16px">Loading...</div><a class="app-btn secondary" style="margin-top:14px" href="account.html">← Account</a></main><script>
const c=window.supabase.createClient(TDM_SUPABASE_URL,TDM_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});async function load(){const {data:{user}}=await c.auth.getUser();if(!user){location.href='account.html?login=required';return}const {data,error}=await c.from('Orders').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error){orders.innerHTML='<p>Unable to load orders: '+error.message+'</p>';return}if(!data?.length){orders.innerHTML='<h2>No orders yet</h2><p>Your completed orders will appear here.</p>';return}orders.innerHTML=data.map(o=>`<div class="order"><h3>${esc(o.product_name)}</h3><p>Quantity: <strong>${o.quantity}</strong></p><p>Amount: <strong>₦${Number(o.total_amount||0).toLocaleString()}</strong></p><p>Status: <span class="status">${esc(o.status||'Received')}</span></p><small>${new Date(o.created_at).toLocaleString()}</small></div>`).join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();tdmInjectNav('account');</script></body></html>
