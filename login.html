<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TDM Customer Login</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#f97316"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-common.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(145deg,#fff7ed,#ffedd5,#fff);padding:20px;color:#111827}.auth-page{width:min(430px,100%);margin:auto}.top-logo{text-align:center;margin:15px 0 18px}.top-logo .logo{width:92px;height:92px;padding:6px;border-radius:25px;background:linear-gradient(145deg,#f97316,#fb923c);display:inline-block;box-shadow:0 10px 25px #f9731640}.top-logo img{width:100%;height:100%;object-fit:contain;border-radius:19px;background:#111}.card{background:#fff;border:2px solid #f97316;border-radius:28px;padding:24px;box-shadow:0 20px 50px #f9731620}.card h1{text-align:center;margin:0 0 7px;font-size:27px}.sub{text-align:center;color:#6b7280;margin:0 0 22px}.field{margin:13px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:15px;border:1.5px solid #fdba74;border-radius:14px;font:inherit;outline:none}.field input:focus{border-color:#f97316;box-shadow:0 0 0 3px #f9731620}.btn{width:100%;padding:15px;border:0;border-radius:15px;background:#f97316;color:#fff;font-weight:900;font-size:16px;margin-top:8px}.message{min-height:24px;text-align:center;font-size:14px;margin-top:14px}.links{text-align:center;margin-top:18px}.links a{color:#c2410c;font-weight:800;text-decoration:none}.back{display:block;text-align:center;margin-top:14px;color:#c2410c;font-weight:800;text-decoration:none}
</style></head><body><main class="auth-page"><div class="top-logo"><div class="logo"><img src="logo.png" alt="TDM Manufacturing"></div></div><section class="card"><h1>Customer Login</h1><p class="sub">Access your TDM account</p><div class="field"><label>Email or phone number</label><input id="identifier" type="text" autocomplete="username" placeholder="Email or phone number"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"></div><button class="btn" id="loginBtn">Log In</button><div class="message" id="message"></div><div class="links">New customer? <a href="signup.html">Create an account</a></div><a class="back" href="auth.html">← Back</a></section></main>
<script>
const client=tdmAuthClient();
async function login(){const msg=document.getElementById('message'),id=document.getElementById('identifier').value.trim(),password=document.getElementById('password').value;if(!id||!password){msg.textContent='Enter your email/phone number and password.';return}msg.textContent='Signing in...';document.getElementById('loginBtn').disabled=true;try{const credentials=id.includes('@')?{email:id,password}:{phone:id,password};const {data,error}=await client.auth.signInWithPassword(credentials);if(error)throw error;if(!data.user)throw new Error('No customer account was returned.');tdmFinishLogin()}catch(e){msg.textContent='Login failed: '+e.message}finally{document.getElementById('loginBtn').disabled=false}}
document.getElementById('loginBtn').addEventListener('click',login);document.querySelectorAll('input').forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')login()}));
</script></body></html>
