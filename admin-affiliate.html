<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><title>TDM Admin | Affiliate</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-common.js"></script><script src="admin-common.js"></script><link rel="stylesheet" href="admin-ui.css"></head><body><div class="admin-shell"><header class="admin-header"><div class="brand"><img src="logo.png"><div><strong>TDM Manufacturing</strong><span>Affiliate Management</span></div></div><div class="toolbar"><a class="btn secondary" href="admin-dashboard.html">Dashboard</a><button onclick="tdmAdminLogout()" class="logout">Log Out</button></div></header><main><div class="dashboard-head"><div><h1>🤝 Affiliate</h1><p class="muted">See every participant, link click, commission, withdrawal and payment.</p></div><button onclick="loadAll()">Refresh</button></div><div class="stats" id="stats"></div><section class="admin-card"><div class="toolbar"><input id="search" placeholder="Search affiliate name, email or code"><select id="commStatus"><option value="all">All commission statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="paid">Paid</option></select></div><p id="msg" class="status"></p></section><section id="list" class="card-grid"></section></main></div><script>let affiliates=[],users={},comm=[],clicks=[],withdrawals=[];async function init(){if(!await tdmAdminRequire())return;search.addEventListener('input',render);commStatus.addEventListener('change',render);await loadAll()}async function loadAll(){const c=tdmAdminClient();const [a,u,cm,cl,w]=await Promise.all([c.from('affiliates').select('*').order('created_at',{ascending:false}),c.from('Customers').select('id,full_name,email,phone'),c.from('affiliate_commissions').select('*').order('created_at',{ascending:false}),c.from('affiliate_clicks').select('*').order('created_at',{ascending:false}),c.from('affiliate_withdrawals').select('*').order('created_at',{ascending:false})]);const err=[a,u,cm,cl,w].find(x=>x.error);if(err){msg.textContent=err.error.message;return;}affiliates=a.data||[];users=Object.fromEntries((u.data||[]).map(x=>[x.id,x]));comm=cm.data||[];clicks=cl.data||[];withdrawals=w.data||[];renderStats();render();msg.textContent=affiliates.length+' affiliate participant(s)'}function renderStats(){const unpaid=comm.filter(x=>x.status!=='paid').reduce((n,x)=>n+Number(x.amount||0),0),paid=comm.filter(x=>x.status==='paid').reduce((n,x)=>n+Number(x.amount||0),0);stats.innerHTML=[['Affiliates',affiliates.length],['Clicks',clicks.length],['Commissions',comm.length],['Unpaid',tdmAdminMoney(unpaid)],['Paid',tdmAdminMoney(paid)]].map(x=>`<div><b>${x[0]}</b><strong>${x[1]}</strong></div>`).join('')}function render(){const q=search.value.trim().toLowerCase(),filter=commStatus.value;list.innerHTML=affiliates.filter(a=>{const u=users[a.user_id]||{};return !q||[u.full_name,u.email,u.phone,a.affiliate_code].join(' ').toLowerCase().includes(q)}).map(a=>{const u=users[a.user_id]||{},cs=comm.filter(x=>x.affiliate_user_id===a.user_id&&(filter==='all'||x.status===filter)),cks=clicks.filter(x=>x.affiliate_user_id===a.user_id||x.affiliate_code===a.affiliate_code),ws=withdrawals.filter(x=>x.user_id===a.user_id);return `<article class="item-card"><span class="pill">${tdmAdminEsc(a.status||'active')}</span><h2>${tdmAdminEsc(u.full_name||a.affiliate_code)}</h2><p>${tdmAdminEsc(u.email||'')} · ${tdmAdminEsc(u.phone||'')}</p><p><b>Code:</b> ${tdmAdminEsc(a.affiliate_code)} · <b>Clicks:</b> ${cks.length}</p><p><b>Balance:</b> ${tdmAdminMoney(a.reward_balance)} · <b>Lifetime:</b> ${tdmAdminMoney(a.lifetime_rewards)}</p><label>Set balance</label><input id="bal_${a.user_id}" type="number" value="${Number(a.reward_balance||0)}"><button onclick="setBalance('${a.user_id}')">Save Balance</button><h3>Commissions</h3>${cs.length?cs.map(x=>`<div style="border-top:1px solid #eee;padding:9px 0"><b>${tdmAdminMoney(x.amount)}</b> · ${tdmAdminEsc(x.status)} · Order ${tdmAdminEsc(x.order_id||'')}<div class="toolbar"><select onchange="setCommission('${x.id}',this.value)"><option value="pending" ${x.status==='pending'?'selected':''}>Pending</option><option value="approved" ${x.status==='approved'?'selected':''}>Approved</option><option value="paid" ${x.status==='paid'?'selected':''}>Paid</option></select></div></div>`).join(''):'No commission records.'}<h3>Withdrawal requests</h3>${ws.length?ws.map(x=>`<div style="border-top:1px solid #eee;padding:9px 0">${tdmAdminMoney(x.amount)} · ${tdmAdminEsc(x.status)}<br>${tdmAdminEsc(JSON.stringify(x.payout_account||{}))}<select onchange="setWithdrawal('${x.id}',this.value)"><option value="pending" ${x.status==='pending'?'selected':''}>Pending</option><option value="approved" ${x.status==='approved'?'selected':''}>Approved</option><option value="paid" ${x.status==='paid'?'selected':''}>Paid</option><option value="rejected" ${x.status==='rejected'?'selected':''}>Rejected</option></select></div>`).join(''):'No withdrawal requests.'}</article>`}).join('')||'<div class="admin-card"><p>No matching affiliates.</p></div>'}async function setBalance(uid){const r=await tdmAdminClient().from('affiliates').update({reward_balance:Number(document.getElementById('bal_'+uid).value)||0}).eq('user_id',uid);if(r.error)alert(r.error.message);await loadAll()}async function setCommission(id,status){const r=await tdmAdminClient().from('affiliate_commissions').update({status,paid_at:status==='paid'?new Date().toISOString():null}).eq('id',id);if(r.error)alert(r.error.message);await loadAll()}async function setWithdrawal(id,status){const c=tdmAdminClient();const old=await c.from('affiliate_withdrawals').select('id,user_id,amount,status').eq('id',id).maybeSingle();if(old.error){alert(old.error.message);return}if(!old.data)return;const r=await c.from('affiliate_withdrawals').update({status}).eq('id',id);if(r.error){alert(r.error.message);return}if(status==='paid'&&old.data.status!=='paid'){const bal=await c.from('affiliates').select('reward_balance').eq('user_id',old.data.user_id).maybeSingle();if(!bal.error){const next=Math.max(0,Number(bal.data?.reward_balance||0)-Number(old.data.amount||0));const u=await c.from('affiliates').update({reward_balance:next}).eq('user_id',old.data.user_id);if(u.error)alert('Withdrawal marked paid but balance update failed: '+u.error.message)}}await loadAll()}init();</script></body></html>
