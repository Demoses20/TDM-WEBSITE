<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f97316">
<title>TDM Admin | Affiliate</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-common.js"></script>
<script src="admin-common.js"></script>
<link rel="stylesheet" href="admin-ui.css">

<style>
/* =========================================================
   TDM AFFILIATE PAGE - RESPONSIVE OVERRIDE
   This section only controls the appearance/layout.
   It does not change the JavaScript functionality.
========================================================= */

html,
body{
  width:100%;
  max-width:100%;
  min-width:0;
  margin:0;
  padding:0;
  overflow-x:hidden;
}

body{
  box-sizing:border-box;
}

/* Make every element calculate its size safely */
*,
*::before,
*::after{
  box-sizing:border-box;
  min-width:0;
  max-width:100%;
}

/* Main page wrapper */
.admin-shell{
  display:block !important;
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;
  margin:0 auto !important;
  padding:8px !important;
  overflow:hidden !important;
}

/* Main content */
.admin-shell main{
  display:block !important;
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;
  margin:0 !important;
  padding:0 !important;
  overflow:hidden !important;
}

/* =========================================================
   HEADER
========================================================= */

.admin-header{
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;
  overflow:hidden !important;

  display:flex !important;
  align-items:center !important;
  justify-content:space-between !important;
  gap:8px !important;

  padding:8px 4px !important;
}

.brand{
  flex:1 1 auto !important;
  width:auto !important;
  max-width:100% !important;
  min-width:0 !important;
  overflow:hidden !important;
}

.brand img{
  flex:0 0 42px !important;
  width:42px !important;
  height:42px !important;
}

.brand strong{
  font-size:15px !important;
  line-height:1.1 !important;
}

.brand span{
  font-size:10px !important;
  line-height:1.1 !important;
}

.admin-header .toolbar{
  display:flex !important;
  flex:0 1 auto !important;
  width:auto !important;
  max-width:100% !important;
  min-width:0 !important;
  gap:6px !important;
}

.admin-header .toolbar>*{
  flex:0 1 auto !important;
  min-width:0 !important;
  max-width:100% !important;
  white-space:nowrap !important;
}

/* =========================================================
   PAGE TITLE
========================================================= */

.dashboard-head{
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;

  display:flex !important;
  align-items:center !important;
  justify-content:space-between !important;
  gap:8px !important;

  padding:10px 0 !important;
}

.dashboard-head>div{
  flex:1 1 auto !important;
  min-width:0 !important;
  max-width:100% !important;
}

.dashboard-head h1{
  margin:0 0 4px !important;
  font-size:34px !important;
  line-height:1.1 !important;
  overflow-wrap:anywhere !important;
}

.dashboard-head p{
  margin:0 !important;
  line-height:1.35 !important;
  overflow-wrap:anywhere !important;
}

.dashboard-head>button{
  flex:0 0 auto !important;
  width:auto !important;
  max-width:120px !important;
}

/* =========================================================
   STATISTICS
========================================================= */

.stats{
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;

  display:grid !important;
  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  gap:8px !important;

  margin:10px 0 !important;
}

.stats>div{
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;
  overflow:hidden !important;

  padding:11px !important;
  border-radius:14px !important;
}

.stats b,
.stats strong{
  display:block !important;
  max-width:100% !important;
  overflow-wrap:anywhere !important;
  word-break:break-word !important;
}

.stats b{
  font-size:15px !important;
}

.stats strong{
  font-size:20px !important;
  margin-top:5px !important;
}

/* =========================================================
   SEARCH / FILTER CARD
========================================================= */

.admin-card{
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;
  overflow:hidden !important;

  margin:10px 0 !important;
  padding:12px !important;
  border-radius:16px !important;
}

.admin-card .toolbar{
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;

  display:flex !important;
  flex-direction:column !important;
  align-items:stretch !important;
  gap:4px !important;
}

.admin-card .toolbar>*{
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;
  flex:0 0 auto !important;
}

.admin-card input,
.admin-card select{
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;
}

.status{
  max-width:100% !important;
  overflow-wrap:anywhere !important;
  word-break:break-word !important;
}

/* =========================================================
   AFFILIATE LIST
========================================================= */

.card-grid{
  display:grid !important;

  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;

  grid-template-columns:minmax(0,1fr) !important;
  gap:10px !important;
}

/* =========================================================
   AFFILIATE CARD
========================================================= */

.item-card{
  display:block !important;

  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;

  overflow:hidden !important;

  padding:13px !important;
  border-radius:15px !important;
}

.item-card h2,
.item-card h3,
.item-card p,
.item-card span,
.item-card div{
  max-width:100% !important;
  min-width:0 !important;
  overflow-wrap:anywhere !important;
  word-break:break-word !important;
}

.item-card h2{
  font-size:21px !important;
  margin:12px 0 !important;
}

.item-card h3{
  font-size:16px !important;
  margin-top:16px !important;
}

.item-card p{
  line-height:1.45 !important;
}

.item-card input,
.item-card select,
.item-card button{
  display:block !important;
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;
}

.item-card button{
  margin-bottom:8px !important;
}

/* Commission and withdrawal inner blocks */
.item-card .toolbar{
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;
}

.item-card .toolbar>*{
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;
}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:600px){

  html,
  body{
    width:100% !important;
    max-width:100% !important;
    overflow-x:hidden !important;
  }

  .admin-shell{
    width:100% !important;
    max-width:100% !important;
    padding:8px !important;
  }

  /* Header becomes compact */
  .admin-header{
    flex-direction:row !important;
    align-items:center !important;
  }

  .brand{
    flex:1 1 45% !important;
  }

  .admin-header .toolbar{
    flex:1 1 55% !important;
  }

  .admin-header .toolbar>*{
    flex:1 1 0 !important;
    width:0 !important;
    max-width:100% !important;
    padding:10px 6px !important;
    font-size:13px !important;
  }

  .brand img{
    width:40px !important;
    height:40px !important;
    flex-basis:40px !important;
  }

  .brand strong{
    font-size:14px !important;
  }

  .brand span{
    font-size:9px !important;
  }

  /* Affiliate heading */
  .dashboard-head{
    align-items:center !important;
  }

  .dashboard-head h1{
    font-size:30px !important;
  }

  .dashboard-head p{
    font-size:16px !important;
  }

  .dashboard-head>button{
    width:auto !important;
    min-width:76px !important;
    padding:11px 13px !important;
    font-size:14px !important;
  }

  /* Stats stay compact */
  .stats{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:8px !important;
  }

  .stats>div{
    padding:10px !important;
  }

  /* Search/filter */
  .admin-card{
    padding:12px !important;
  }

  /* One affiliate card per row */
  .card-grid{
    grid-template-columns:minmax(0,1fr) !important;
  }

}

/* =========================================================
   EXTRA SMALL PHONES
========================================================= */

@media(max-width:380px){

  .admin-shell{
    padding:6px !important;
  }

  .admin-header{
    gap:5px !important;
  }

  .brand img{
    width:36px !important;
    height:36px !important;
    flex-basis:36px !important;
  }

  .brand strong{
    font-size:13px !important;
  }

  .brand span{
    font-size:8px !important;
  }

  .admin-header .toolbar>*{
    padding:9px 4px !important;
    font-size:12px !important;
  }

  .dashboard-head h1{
    font-size:27px !important;
  }

  .dashboard-head p{
    font-size:15px !important;
  }

  .dashboard-head>button{
    min-width:70px !important;
    padding:10px !important;
    font-size:13px !important;
  }

  .stats{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  }

  .stats>div{
    padding:9px !important;
  }

  .stats b{
    font-size:14px !important;
  }

  .stats strong{
    font-size:18px !important;
  }

  .item-card{
    padding:11px !important;
  }

}

/* =========================================================
   ULTRA SMALL PHONES
========================================================= */

@media(max-width:320px){

  .stats{
    grid-template-columns:minmax(0,1fr) !important;
  }

  .admin-header .toolbar>*{
    font-size:11px !important;
  }

}
</style>
</head>

<body>

<div class="admin-shell">

<header class="admin-header">

  <div class="brand">
    <img src="logo.png" alt="TDM Manufacturing">

    <div>
      <strong>TDM Manufacturing</strong>
      <span>Affiliate Management</span>
    </div>
  </div>

  <div class="toolbar">
    <a class="btn secondary" href="admin-dashboard.html">Dashboard</a>
    <button onclick="tdmAdminLogout()" class="logout">Log Out</button>
  </div>

</header>

<main>

  <div class="dashboard-head">

    <div>
      <h1>🤝 Affiliate</h1>
      <p class="muted">
        See every participant, link click, commission, withdrawal and payment.
      </p>
    </div>

    <button onclick="loadAll()">Refresh</button>

  </div>

  <div class="stats" id="stats"></div>

  <section class="admin-card">

    <div class="toolbar">

      <input
        id="search"
        placeholder="Search affiliate name, email or code"
      >

      <select id="commStatus">
        <option value="all">All commission statuses</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="paid">Paid</option>
      </select>

    </div>

    <p id="msg" class="status"></p>

  </section>

  <section id="list" class="card-grid"></section>

</main>

</div>

<script>
let affiliates=[],users={},comm=[],clicks=[],withdrawals=[];

async function init(){
  if(!await tdmAdminRequire())return;
  search.addEventListener('input',render);
  commStatus.addEventListener('change',render);
  await loadAll()
}

async function loadAll(){
  const c=tdmAdminClient();

  const [a,u,cm,cl,w]=await Promise.all([
    c.from('affiliates')
      .select('*')
      .order('created_at',{ascending:false}),

    c.from('Customers')
      .select('id,full_name,email,phone'),

    c.from('affiliate_commissions')
      .select('*')
      .order('created_at',{ascending:false}),

    c.from('affiliate_clicks')
      .select('*')
      .order('created_at',{ascending:false}),

    c.from('affiliate_withdrawals')
      .select('*')
      .order('created_at',{ascending:false})
  ]);

  const err=[a,u,cm,cl,w].find(x=>x.error);

  if(err){
    msg.textContent=err.error.message;
    return
  }

  affiliates=a.data||[];
  users=Object.fromEntries(
    (u.data||[]).map(x=>[x.id,x])
  );
  comm=cm.data||[];
  clicks=cl.data||[];
  withdrawals=w.data||[];

  renderStats();
  render();

  msg.textContent=affiliates.length+' affiliate participant(s)'
}

function renderStats(){

  const unpaid=comm
    .filter(x=>x.status!=='paid')
    .reduce((n,x)=>n+Number(x.amount||0),0);

  const paid=comm
    .filter(x=>x.status==='paid')
    .reduce((n,x)=>n+Number(x.amount||0),0);

  stats.innerHTML=[
    ['Affiliates',affiliates.length],
    ['Clicks',clicks.length],
    ['Commissions',comm.length],
    ['Unpaid',tdmAdminMoney(unpaid)],
    ['Paid',tdmAdminMoney(paid)]
  ]
  .map(x=>`
    <div>
      <b>${x[0]}</b>
      <strong>${x[1]}</strong>
    </div>
  `)
  .join('')
}

function render(){

  const q=search.value.trim().toLowerCase();
  const filter=commStatus.value;

  list.innerHTML=affiliates
    .filter(a=>{
      const u=users[a.user_id]||{};

      return !q ||
        [
          u.full_name,
          u.email,
          u.phone,
          a.affiliate_code
        ]
        .join(' ')
        .toLowerCase()
        .includes(q)
    })
    .map(a=>{

      const u=users[a.user_id]||{};

      const cs=comm.filter(
        x=>
          x.affiliate_user_id===a.user_id &&
          (filter==='all'||x.status===filter)
      );

      const cks=clicks.filter(
        x=>
          x.affiliate_user_id===a.user_id ||
          x.affiliate_code===a.affiliate_code
      );

      const ws=withdrawals.filter(
        x=>x.user_id===a.user_id
      );

      return `
        <article class="item-card">

          <span class="pill">
            ${tdmAdminEsc(a.status||'active')}
          </span>

          <h2>
            ${tdmAdminEsc(u.full_name||a.affiliate_code)}
          </h2>

          <p>
            ${tdmAdminEsc(u.email||'')}
            ·
            ${tdmAdminEsc(u.phone||'')}
          </p>

          <p>
            <b>Code:</b>
            ${tdmAdminEsc(a.affiliate_code)}
            ·
            <b>Clicks:</b>
            ${cks.length}
          </p>

          <p>
            <b>Balance:</b>
            ${tdmAdminMoney(a.reward_balance)}
            ·
            <b>Lifetime:</b>
            ${tdmAdminMoney(a.lifetime_rewards)}
          </p>

          <label>Set balance</label>

          <input
            id="bal_${a.user_id}"
            type="number"
            value="${Number(a.reward_balance||0)}"
          >

          <button onclick="setBalance('${a.user_id}')">
            Save Balance
          </button>

          <h3>Commissions</h3>

          ${
            cs.length
            ?
            cs.map(x=>`
              <div style="border-top:1px solid #eee;padding:9px 0">

                <b>${tdmAdminMoney(x.amount)}</b>
                ·
                ${tdmAdminEsc(x.status)}
                ·
                Order
                ${tdmAdminEsc(x.order_id||'')}

                <div class="toolbar">

                  <select
                    onchange="setCommission('${x.id}',this.value)"
                  >

                    <option
                      value="pending"
                      ${x.status==='pending'?'selected':''}
                    >
                      Pending
                    </option>

                    <option
                      value="approved"
                      ${x.status==='approved'?'selected':''}
                    >
                      Approved
                    </option>

                    <option
                      value="paid"
                      ${x.status==='paid'?'selected':''}
                    >
                      Paid
                    </option>

                  </select>

                </div>

              </div>
            `).join('')
            :
            'No commission records.'
          }

          <h3>Withdrawal requests</h3>

          ${
            ws.length
            ?
            ws.map(x=>`
              <div style="border-top:1px solid #eee;padding:9px 0">

                ${tdmAdminMoney(x.amount)}
                ·
                ${tdmAdminEsc(x.status)}

                <br>

                ${tdmAdminEsc(
                  JSON.stringify(x.payout_account||{})
                )}

                <select
                  onchange="setWithdrawal('${x.id}',this.value)"
                >

                  <option
                    value="pending"
                    ${x.status==='pending'?'selected':''}
                  >
                    Pending
                  </option>

                  <option
                    value="approved"
                    ${x.status==='approved'?'selected':''}
                  >
                    Approved
                  </option>

                  <option
                    value="paid"
                    ${x.status==='paid'?'selected':''}
                  >
                    Paid
                  </option>

                  <option
                    value="rejected"
                    ${x.status==='rejected'?'selected':''}
                  >
                    Rejected
                  </option>

                </select>

              </div>
            `).join('')
            :
            'No withdrawal requests.'
          }

        </article>
      `
    })
    .join('')
    ||
    '<div class="admin-card"><p>No matching affiliates.</p></div>'
}

async function setBalance(uid){

  const r=await tdmAdminClient()
    .from('affiliates')
    .update({
      reward_balance:
        Number(
          document.getElementById('bal_'+uid).value
        )||0
    })
    .eq('user_id',uid);

  if(r.error){
    alert(r.error.message);
    return
  }

  await loadAll()
}

async function sendAffiliateEmail({
  userId,
  status,
  amount,
  orderId,
  type
}){

  try{

    const c=tdmAdminClient();

    const emailPayload={
      customer_id:userId,
      update_type:'status',
      status:
        type==='commission'
        ?`Affiliate commission ${status}`
        :`Affiliate withdrawal ${status}`,
      payment_status:status,
      affiliate_payment_status:status,
      affiliate_commission_amount:Number(amount||0),
      order_id:orderId||'',
      product_name:
        type==='commission'
        ?'Affiliate commission'
        :'Affiliate withdrawal',
      quantity:1,
      total_amount:amount||''
    };

    const er=await c.functions.invoke(
      'resend-email',
      {body:emailPayload}
    );

    if(er.error){

      console.error(
        'Affiliate email notification failed:',
        er.error
      );

      alert(
        'Updated successfully, but the email notification failed: '+
        (er.error.message||'Unknown email error')
      );

      return false
    }

    if(er.data?.success===false){

      console.error(
        'Affiliate email notification failed:',
        er.data
      );

      alert(
        'Updated successfully, but the email notification failed: '+
        (er.data.error||
         er.data.message||
         'Unknown email error')
      );

      return false
    }

    console.log(
      'Affiliate email notification sent:',
      er.data
    );

    return true

  }catch(e){

    console.error(
      'Affiliate email notification failed:',
      e
    );

    alert(
      'Updated successfully, but the email notification failed: '+
      (e.message||'Unknown email error')
    );

    return false
  }
}

async function setCommission(id,status){

  const c=tdmAdminClient();

  const old=await c
    .from('affiliate_commissions')
    .select(
      'id,affiliate_user_id,order_id,amount,status'
    )
    .eq('id',id)
    .maybeSingle();

  if(old.error){
    alert(old.error.message);
    return
  }

  if(!old.data){
    alert('Commission record not found.');
    return
  }

  const r=await c
    .from('affiliate_commissions')
    .update({
      status,
      paid_at:
        status==='paid'
        ?new Date().toISOString()
        :null
    })
    .eq('id',id);

  if(r.error){
    alert(r.error.message);
    return
  }

  await sendAffiliateEmail({
    userId:old.data.affiliate_user_id,
    status,
    amount:old.data.amount||0,
    orderId:old.data.order_id||'',
    type:'commission'
  });

  await loadAll()
}

async function setWithdrawal(id,status){

  const c=tdmAdminClient();

  const old=await c
    .from('affiliate_withdrawals')
    .select(
      'id,user_id,amount,status'
    )
    .eq('id',id)
    .maybeSingle();

  if(old.error){
    alert(old.error.message);
    return
  }

  if(!old.data){
    alert('Withdrawal record not found.');
    return
  }

  const previousStatus=old.data.status;

  const r=await c
    .from('affiliate_withdrawals')
    .update({status})
    .eq('id',id);

  if(r.error){
    alert(r.error.message);
    return
  }

  if(
    status==='paid' &&
    previousStatus!=='paid'
  ){

    const bal=await c
      .from('affiliates')
      .select('reward_balance')
      .eq('user_id',old.data.user_id)
      .maybeSingle();

    if(!bal.error){

      const next=Math.max(
        0,
        Number(
          bal.data?.reward_balance||0
        )-
        Number(
          old.data.amount||0
        )
      );

      const u=await c
        .from('affiliates')
        .update({
          reward_balance:next
        })
        .eq('user_id',old.data.user_id);

      if(u.error){

        alert(
          'Withdrawal marked paid but balance update failed: '+
          u.error.message
        )
      }

    }else{

      alert(
        'Withdrawal marked paid but balance could not be checked: '+
        bal.error.message
      )
    }
  }

  await sendAffiliateEmail({
    userId:old.data.user_id,
    status,
    amount:old.data.amount||0,
    orderId:'',
    type:'withdrawal'
  });

  await loadAll()
}

init();
</script>

</body>
</html>
