<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><title>TDM Admin | Store</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-common.js"></script><script src="admin-common.js"></script><link rel="stylesheet" href="admin-ui.css"><style>html,body{width:100%;max-width:100%;overflow-x:hidden}*,*:before,*:after{box-sizing:border-box}img,video{max-width:100%;height:auto}.admin-shell,main{width:100%;max-width:100%;overflow-x:hidden}.card-grid{min-width:0}.item-card{min-width:0;overflow:hidden}.toolbar{flex-wrap:wrap}button,.btn,input,select,textarea{max-width:100%}</style></head><body><div class="admin-shell"><header class="admin-header"><div class="brand"><img src="logo.png"><div><strong>TDM Manufacturing</strong><span>Store Management</span></div></div><div class="toolbar"><a class="btn secondary" href="admin-dashboard.html">Dashboard</a><button onclick="tdmAdminLogout()" class="logout">Log Out</button></div></header><main><div class="dashboard-head"><div><h1>🛒 Store</h1><p class="muted">Create, edit, publish, unpublish and delete products. Upload photos/videos directly from the device.</p></div><button onclick="loadProducts()">Refresh</button></div><section class="admin-card"><h2 id="formTitle">Add Product</h2><input id="id" type="hidden"><label>Product name</label><input id="name" placeholder="TDM 5 kg Spiral Mixer"><label>Slug</label><input id="slug" placeholder="tdm-5kg-spiral-mixer"><label>Category</label><input id="category" value="Bakery"><label>Price</label><input id="price" type="number" step="0.01" placeholder="Leave blank for Request quote"><label>Currency</label><input id="currency" value="₦"><label>Stock quantity</label><input id="stock" type="number" value="0"><label>Affiliate commission percentage</label><input id="affiliateRate" type="number" min="0" max="100" step="0.01" value="5" placeholder="5"><small class="muted">Set the referral commission for this product. Example: 5 means 5%.</small><label>Primary media URL (optional)</label><input id="image" placeholder="Filled automatically after upload"><label>Upload product photos/videos</label><input id="files" type="file" accept="image/*,video/*" multiple><label>Existing media URLs (one per line)</label><textarea id="media" rows="4"></textarea><label>Short description</label><input id="short"><label>Full description</label><textarea id="description" rows="5"></textarea><label>Status</label><select id="status"><option value="published">Published</option><option value="draft">Draft</option></select><div class="toolbar"><button onclick="uploadProductMedia()">Upload Media</button><button onclick="saveProduct()">Save Product</button><button class="secondary" onclick="clearForm()">New Product</button></div><p id="msg" class="status"></p></section><section class="admin-card"><h2>Products</h2><div id="products" class="card-grid"></div></section></main></div><script>let products=[];async function init(){if(!await tdmAdminRequire())return;await loadProducts()}async function loadProducts(){const client=tdmAdminClient();const r=await client.from('products').select('*').order('created_at',{ascending:false});if(r.error){msg.textContent=r.error.message;return;}products=r.data||[];try{const a=await client.from('affiliate_products').select('product_id,commission_rate,active');if(!a.error){const rates=Object.fromEntries((a.data||[]).map(x=>[String(x.product_id),x]));products=products.map(p=>({...p,affiliate_rate:rates[String(p.id)]?.commission_rate??p.affiliate_rate??5,affiliate_active:rates[String(p.id)]?.active}));}}catch(e){}render()}function parseMedia(v){if(Array.isArray(v))return v.flatMap(parseMedia);if(!v)return[];if(typeof v==='object')return[v.url||v.publicUrl||v.src].filter(Boolean);try{const j=JSON.parse(String(v));if(j!==v)return parseMedia(j)}catch(e){}return String(v).split(/\n|,/).map(x=>x.trim()).filter(Boolean)}function render(){document.getElementById('products').innerHTML=products.length?products.map(p=>{const media=parseMedia(p.media_urls);const all=media.length?media:[p.image_url||p.image].filter(Boolean);return `<article class="item-card"><span class="pill">${tdmAdminEsc(p.status||'draft')}</span><h3>${tdmAdminEsc(p.name||'Unnamed')}</h3><p>${tdmAdminEsc(p.category||'')} · ${p.price==null?'Request quote':tdmAdminMoney(p.price)} · Stock ${Number(p.stock_quantity||0)} · Affiliate ${Number(p.affiliate_rate??p.commission_rate??5)}%</p><div class="thumbs">${all.map(u=>mediaTag(u)).join('')}</div><div class="toolbar"><button onclick='editProduct(${JSON.stringify(p)})'>Edit</button><button class="secondary" onclick="toggleProduct('${p.id}','${p.status}')">${p.status==='published'?'Unpublish':'Publish'}</button><button class="danger" onclick="deleteProduct('${p.id}')">Delete</button></div></article>`}).join(''):'<p>No products yet.</p>'}function mediaTag(u){const s=tdmAdminEsc(u);return /\.(mp4|webm|ogg|mov)(\?|$)/i.test(u)?`<video src="${s}" controls></video>`:`<img src="${s}" onerror="this.src='logo.png'">`}function editProduct(p){id.value=p.id;name.value=p.name||'';slug.value=p.slug||'';category.value=p.category||'Bakery';price.value=p.price??'';currency.value=p.currency||'₦';stock.value=p.stock_quantity??0;image.value=p.image_url||p.image||'';media.value=parseMedia(p.media_urls).join('\n');short.value=p.short_description||'';description.value=p.description||'';status.value=p.status||'draft';affiliateRate.value=p.affiliate_rate??p.commission_rate??5;formTitle.textContent='Edit Product';window.scrollTo({top:0,behavior:'smooth'})}function clearForm(){['id','name','slug','price','image','media','short','description'].forEach(x=>document.getElementById(x).value='');category.value='Bakery';currency.value='₦';stock.value='0';status.value='published';affiliateRate.value='5';formTitle.textContent='Add Product';files.value=''}async function uploadProductMedia(){const selected=[...files.files||[]],m=document.getElementById('msg');if(!selected.length){m.textContent='Choose photos/videos first.';return;}const urls=parseMedia(media.value);for(const file of selected){if(file.size>100*1024*1024){m.textContent='A selected file is larger than 100 MB.';return;}const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'-');const path='products/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+safe;const r=await tdmAdminClient().storage.from('tdm-media').upload(path,file,{upsert:false,contentType:file.type});if(r.error){m.textContent='Upload failed: '+r.error.message;return;}urls.push(tdmAdminClient().storage.from('tdm-media').getPublicUrl(path).data.publicUrl);}media.value=urls.join('\n');if(!image.value&&urls[0])image.value=urls[0];m.textContent=selected.length+' media file(s) uploaded. Click Save Product.'}async function saveProduct(){const m=document.getElementById('msg');const n=name.value.trim();if(!n){m.textContent='Product name is required.';return;}const rate=Math.min(100,Math.max(0,Number(affiliateRate.value)||0));const payload={name:n,slug:slug.value.trim()||n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),category:category.value.trim()||'Bakery',price:price.value===''?null:Number(price.value),currency:currency.value.trim()||'₦',stock_quantity:Number(stock.value)||0,image_url:image.value.trim(),short_description:short.value.trim(),description:description.value.trim(),media_urls:parseMedia(media.value),status:status.value};let productId=id.value;let r;if(productId){r=await tdmAdminClient().from('products').update(payload).eq('id',productId)}else{r=await tdmAdminClient().from('products').insert(payload).select('id').single();if(!r.error)productId=r.data.id}if(r.error){m.textContent='Save failed: '+r.error.message;return;}const ar=await tdmAdminClient().from('affiliate_products').upsert({product_id:productId,product_name:n,commission_rate:rate,active:status.value==='published'},{onConflict:'product_id'});if(ar.error){m.textContent='Product saved, but affiliate setting failed: '+ar.error.message;return;}m.textContent='Product saved with '+rate+'% affiliate commission.';clearForm();await loadProducts()}async function clearHomeBannerForProduct(p){if(!p)return;try{const client=tdmAdminClient();const b=await client.from('home_banners').select('id,mode,active,media_url,title').eq('id',1).maybeSingle();if(b.error||!b.data)return;const banner=b.data;if(banner.mode==='auto'||banner.active===false)return;const productMedia=parseMedia(p.media_urls);const productUrls=[p.image_url,p.image,...productMedia].filter(Boolean).map(String);const bannerUrl=String(banner.media_url||'');const sameMedia=!!bannerUrl&&productUrls.some(u=>u===bannerUrl);const sameTitle=String(banner.title||'').trim().toLowerCase()===String(p.name||'').trim().toLowerCase();if(sameMedia||sameTitle){const r=await client.from('home_banners').update({mode:'auto',active:false,media_url:'',updated_at:new Date().toISOString()}).eq('id',1);if(r.error)console.warn('Could not clear home banner:',r.error.message);}}catch(e){console.warn('Home banner cleanup skipped:',e.message)}}async function toggleProduct(pid,s){const p=products.find(x=>String(x.id)===String(pid));const nextStatus=s==='published'?'draft':'published';const r=await tdmAdminClient().from('products').update({status:nextStatus}).eq('id',pid);if(r.error){alert(r.error.message);return;}try{await tdmAdminClient().from('affiliate_products').update({active:nextStatus==='published'}).eq('product_id',pid)}catch(e){}if(p&&nextStatus!=='published')await clearHomeBannerForProduct(p);await loadProducts()}async function cleanupAffiliateForProduct(pid){const client=tdmAdminClient();const tables=['affiliate_products','affiliate_clicks','affiliate_commissions'];for(const table of tables){try{const r=await client.from(table).delete().eq('product_id',pid);if(r.error&& !/column .*product_id.*does not exist|could not find/i.test(r.error.message))console.warn('Affiliate cleanup '+table+':',r.error.message)}catch(e){console.warn('Affiliate cleanup '+table+' skipped:',e.message)}}}async function deleteProduct(pid){if(!confirm('Delete this product, its stored media, home banner reference, affiliate link, clicks and commissions for this product?'))return;const p=products.find(x=>String(x.id)===String(pid));if(!p)return;const client=tdmAdminClient();const media=parseMedia(p.media_urls);await clearHomeBannerForProduct(p);await cleanupAffiliateForProduct(pid);for(const u of media){const path=storagePath(u);if(path)await client.storage.from('tdm-media').remove([path])}const imagePath=storagePath(p.image_url||p.image);if(imagePath&&!media.includes(p.image_url||p.image))await client.storage.from('tdm-media').remove([imagePath]);const r=await client.from('products').delete().eq('id',pid);if(r.error){alert('Product delete failed: '+r.error.message);return;}alert('Product, product media, banner reference, affiliate link and product affiliate records deleted.');await loadProducts()}function storagePath(url){try{const u=new URL(url);const marker='/storage/v1/object/public/tdm-media/';const i=u.pathname.indexOf(marker);return i>=0?decodeURIComponent(u.pathname.slice(i+marker.length)):null}catch(e){return null}}init();</script></body></html>
