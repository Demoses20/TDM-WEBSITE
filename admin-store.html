<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><title>TDM Admin | Store</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-common.js"></script><script src="admin-common.js"></script><link rel="stylesheet" href="admin-ui.css"></head><body><div class="admin-shell"><header class="admin-header"><div class="brand"><img src="logo.png"><div><strong>TDM Manufacturing</strong><span>Store Management</span></div></div><div class="toolbar"><a class="btn secondary" href="admin-dashboard.html">Dashboard</a><button onclick="tdmAdminLogout()" class="logout">Log Out</button></div></header><main><div class="dashboard-head"><div><h1>🛒 Store</h1><p class="muted">Create, edit, publish, unpublish and delete products. Upload photos/videos directly from the device.</p></div><button onclick="loadProducts()">Refresh</button></div><section class="admin-card"><h2 id="formTitle">Add Product</h2><input id="id" type="hidden"><label>Product name</label><input id="name" placeholder="TDM 5 kg Spiral Mixer"><label>Slug</label><input id="slug" placeholder="tdm-5kg-spiral-mixer"><label>Category</label><input id="category" value="Bakery"><label>Price</label><input id="price" type="number" step="0.01" placeholder="Leave blank for Request quote"><label>Currency</label><input id="currency" value="₦"><label>Stock quantity</label><input id="stock" type="number" value="0"><label>Primary media URL (optional)</label><input id="image" placeholder="Filled automatically after upload"><label>Upload product photos/videos</label><input id="files" type="file" accept="image/*,video/*" multiple><label>Existing media URLs (one per line)</label><textarea id="media" rows="4"></textarea><label>Short description</label><input id="short"><label>Full description</label><textarea id="description" rows="5"></textarea><label>Status</label><select id="status"><option value="published">Published</option><option value="draft">Draft</option></select><div class="toolbar"><button onclick="uploadProductMedia()">Upload Media</button><button onclick="saveProduct()">Save Product</button><button class="secondary" onclick="clearForm()">New Product</button></div><p id="msg" class="status"></p></section><section class="admin-card"><h2>Products</h2><div id="products" class="card-grid"></div></section></main></div><script>let products=[];async function init(){if(!await tdmAdminRequire())return;await loadProducts()}async function loadProducts(){const r=await tdmAdminClient().from('products').select('*').order('created_at',{ascending:false});if(r.error){msg.textContent=r.error.message;return;}products=r.data||[];render()}function parseMedia(v){if(Array.isArray(v))return v.flatMap(parseMedia);if(!v)return[];if(typeof v==='object')return[v.url||v.publicUrl||v.src].filter(Boolean);try{const j=JSON.parse(String(v));if(j!==v)return parseMedia(j)}catch(e){}return String(v).split(/\n|,/).map(x=>x.trim()).filter(Boolean)}function render(){document.getElementById('products').innerHTML=products.length?products.map(p=>{const media=parseMedia(p.media_urls);const all=media.length?media:[p.image_url||p.image].filter(Boolean);return `<article class="item-card"><span class="pill">${tdmAdminEsc(p.status||'draft')}</span><h3>${tdmAdminEsc(p.name||'Unnamed')}</h3><p>${tdmAdminEsc(p.category||'')} · ${p.price==null?'Request quote':tdmAdminMoney(p.price)} · Stock ${Number(p.stock_quantity||0)}</p><div class="thumbs">${all.map(u=>mediaTag(u)).join('')}</div><div class="toolbar"><button onclick='editProduct(${JSON.stringify(p)})'>Edit</button><button class="secondary" onclick="toggleProduct('${p.id}','${p.status}')">${p.status==='published'?'Unpublish':'Publish'}</button><button class="danger" onclick="deleteProduct('${p.id}')">Delete</button></div></article>`}).join(''):'<p>No products yet.</p>'}function mediaTag(u){const s=tdmAdminEsc(u);return /\.(mp4|webm|ogg|mov)(\?|$)/i.test(u)?`<video src="${s}" controls></video>`:`<img src="${s}" onerror="this.src='logo.png'">`}function editProduct(p){id.value=p.id;name.value=p.name||'';slug.value=p.slug||'';category.value=p.category||'Bakery';price.value=p.price??'';currency.value=p.currency||'₦';stock.value=p.stock_quantity??0;image.value=p.image_url||p.image||'';media.value=parseMedia(p.media_urls).join('\n');short.value=p.short_description||'';description.value=p.description||'';status.value=p.status||'draft';formTitle.textContent='Edit Product';window.scrollTo({top:0,behavior:'smooth'})}function clearForm(){['id','name','slug','price','image','media','short','description'].forEach(x=>document.getElementById(x).value='');category.value='Bakery';currency.value='₦';stock.value='0';status.value='published';formTitle.textContent='Add Product';files.value=''}async function uploadProductMedia(){const selected=[...files.files||[]],m=document.getElementById('msg');if(!selected.length){m.textContent='Choose photos/videos first.';return;}const urls=parseMedia(media.value);for(const file of selected){if(file.size>100*1024*1024){m.textContent='A selected file is larger than 100 MB.';return;}const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'-');const path='products/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+safe;const r=await tdmAdminClient().storage.from('tdm-media').upload(path,file,{upsert:false,contentType:file.type});if(r.error){m.textContent='Upload failed: '+r.error.message;return;}urls.push(tdmAdminClient().storage.from('tdm-media').getPublicUrl(path).data.publicUrl);}media.value=urls.join('\n');if(!image.value&&urls[0])image.value=urls[0];m.textContent=selected.length+' media file(s) uploaded. Click Save Product.'}async function saveProduct(){const m=document.getElementById('msg');const n=name.value.trim();if(!n){m.textContent='Product name is required.';return;}const payload={name:n,slug:slug.value.trim()||n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),category:category.value.trim()||'Bakery',price:price.value===''?null:Number(price.value),currency:currency.value.trim()||'₦',stock_quantity:Number(stock.value)||0,image_url:image.value.trim(),short_description:short.value.trim(),description:description.value.trim(),media_urls:parseMedia(media.value),status:status.value};const r=id.value?await tdmAdminClient().from('products').update(payload).eq('id',id.value):await tdmAdminClient().from('products').insert(payload);if(r.error){m.textContent='Save failed: '+r.error.message;return;}m.textContent='Product saved.';clearForm();await loadProducts()}async function toggleProduct(pid,s){const r=await tdmAdminClient().from('products').update({status:s==='published'?'draft':'published'}).eq('id',pid);if(r.error){alert(r.error.message);return;}await loadProducts()}async function deleteProduct(pid){if(!confirm('Delete this product?'))return;const p=products.find(x=>String(x.id)===String(pid));if(p){for(const u of parseMedia(p.media_urls)){const path=storagePath(u);if(path)await tdmAdminClient().storage.from('tdm-media').remove([path])}}const r=await tdmAdminClient().from('products').delete().eq('id',pid);if(r.error){alert(r.error.message);return;}await loadProducts()}function storagePath(url){try{const u=new URL(url);const marker='/storage/v1/object/public/tdm-media/';const i=u.pathname.indexOf(marker);return i>=0?decodeURIComponent(u.pathname.slice(i+marker.length)):null}catch(e){return null}}init();</script></body></html>
