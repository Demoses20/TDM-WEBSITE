<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><meta name="description" content="TDM Manufacturing equipment store"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="app-shell.css"><script src="app-common.js"></script><title>TDM Manufacturing | Equipment Store</title><style>
body{margin:0;font-family:Arial,sans-serif}.hero{max-width:1100px;margin:auto;padding:22px 16px}.search{display:flex;gap:8px;margin-top:18px;background:#fff;border:1px solid #fed7aa;padding:6px;border-radius:15px}.search input{flex:1;border:0;outline:0;padding:12px;font-size:16px}.search button{border:0;border-radius:11px;background:#431407;color:#fff;padding:0 17px;font-weight:900}.categories{display:flex;gap:9px;overflow-x:auto;padding:0 16px 12px;max-width:1100px;margin:auto}.chip{border:1px solid #fdba74;background:#fff;border-radius:999px;padding:10px 15px;white-space:nowrap;font-weight:800}.chip.active{background:#f97316;color:#fff}.store{max-width:1100px;margin:auto;padding:8px 16px 35px}.store-head{display:flex;justify-content:space-between;align-items:center}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #fed7aa;border-radius:20px;overflow:hidden;box-shadow:0 10px 28px rgba(16,24,40,.08)}.card-img{height:180px;background:linear-gradient(145deg,#fff7ed,#fff);display:flex;align-items:center;justify-content:center}.card-img img{width:100%;height:100%;object-fit:contain}.card-body{padding:14px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff7ed;color:#c2410c;font-size:11px;font-weight:900}.card h3{font-size:16px;margin:10px 0 6px}.desc{color:#667085;font-size:13px;line-height:1.5;min-height:40px}.price{font-size:17px;font-weight:900;color:#ea580c;margin:10px 0}.stock{font-size:12px;color:#667085;margin-bottom:10px}.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:11px;padding:11px 8px;text-align:center;font-weight:900;text-decoration:none;background:#fff7ed;color:#c2410c;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#f97316,#c2410c);color:#fff}.details{grid-column:1/-1;background:#fff;border:1px solid #fed7aa;border-radius:18px;padding:20px;text-align:center}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#431407;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:10000}@media(min-width:800px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:520px){.card-img{height:145px}.card h3{font-size:15px}.desc{font-size:12px}.store-head h2{font-size:20px}}
</style></head><body><header class="tdm-app-header"><a class="tdm-brand" href="index.html"><img src="logo.png" alt="TDM logo"><div><strong>TDM Manufacturing</strong><span>Precision Engineering &amp; Fabricated Equipment</span></div></a></header><section class="hero"><h1>Equipment Store</h1><p>Browse TDM bakery, food-processing and engineering equipment.</p><div class="search"><input id="searchInput" type="search" placeholder="Search equipment..."><button onclick="render()">Search</button></div></section><div class="categories"><button class="chip active" data-category="all">All</button><button class="chip" data-category="bakery">Bakery</button><button class="chip" data-category="food-processing">Food Processing</button><button class="chip" data-category="custom">Custom Equipment</button></div><main class="store"><div class="store-head"><h2>All Equipment</h2><span id="count">Loading...</span></div><section class="products" id="products"><div class="details">Loading equipment...</div></section></main><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const c=window.supabase.createClient(TDM_SUPABASE_URL,TDM_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});window.tdmSupabaseClient=c;let allProducts=[],activeCategory='all';const products=document.getElementById('products');
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function money(p){if(p.price===null||p.price===undefined||p.price==='')return 'Request quote';return `${p.currency||'₦'} ${Number(p.price||0).toLocaleString()}`}function category(p){return String(p.category||'bakery').toLowerCase().replace(/\s+/g,'-')}
function render(){const q=document.getElementById('searchInput').value.trim().toLowerCase();const list=allProducts.filter(p=>{const t=`${p.name||''} ${p.short_description||''} ${p.description||''} ${p.category||''}`.toLowerCase();return (activeCategory==='all'||category(p)===activeCategory)&&(!q||t.includes(q))});document.getElementById('count').textContent=list.length+' item'+(list.length===1?'':'s');if(!list.length){products.innerHTML='<div class="details">No equipment matches your search.</div>';return}products.innerHTML=list.map(p=>{const img=tdmProductImage(p);const wa=`https://wa.me/2347049087007?text=${encodeURIComponent('Hello TDM Manufacturing, I am interested in '+p.name+'.')}`;return `<article class="card"><a href="product-detail.html?id=${encodeURIComponent(p.id)}" class="card-img"><img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy"></a><div class="card-body"><span class="badge">${esc(p.category||'Equipment')}</span><a href="product-detail.html?id=${encodeURIComponent(p.id)}" style="text-decoration:none;color:inherit"><h3>${esc(p.name||'TDM Equipment')}</h3></a><div class="desc">${esc(p.short_description||p.description||'TDM manufactured equipment.')}</div><div class="price">${money(p)}</div><div class="stock">${p.stock_quantity!=null?'Stock: '+esc(p.stock_quantity):'Made to order'}</div><div class="card-actions"><a class="btn" href="${wa}" target="_blank" rel="noopener">Contact Us</a><button class="btn primary" onclick='addToCart(${JSON.stringify(p.id)},${JSON.stringify(p.name||'TDM Equipment')},${Number(p.price)||0},${JSON.stringify(img)})'>Add to Cart</button></div></div></article>`}).join('')}
async function addToCart(id,name,price,image){const {data:{user}}=await c.auth.getUser();if(!user){sessionStorage.setItem('tdm_return_after_login','product.html');location.href='account.html?login=required';return}const cart=tdmReadCart(user.id),found=cart.find(x=>x.product_id===id||x.name===name);if(found)found.quantity=(Number(found.quantity)||1)+1;else cart.push({product_id:id,name,price,image,quantity:1});tdmWriteCart(cart,user.id);showToast(name+' added to your cart')}
function showToast(t){toast.textContent=t;toast.style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>toast.style.display='none',2200)}
async function load(){const {data,error}=await c.from('products').select('*').eq('status','published').order('created_at',{ascending:false});if(error){products.innerHTML='<div class="details">Unable to load Store. '+esc(error.message)+'</div>';return}allProducts=data||[];render()}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCategory=b.dataset.category;render()});document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')render()});load();tdmInjectNav('store');</script></body></html>
