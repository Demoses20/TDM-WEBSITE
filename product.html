<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="Shop TDM Manufacturing bakery and engineering equipment.">
<link rel="manifest" href="manifest.json">
<title>TDM Manufacturing | Equipment Store</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#171717;padding-bottom:78px}a{text-decoration:none;color:inherit}
hero{max-width:1100px;margin:auto;padding:30px 16px 18px}.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;color:#666}.search{margin-top:20px;display:flex;background:#fff;border:1px solid #ddd;border-radius:13px;padding:5px;box-shadow:0 3px 14px #0000000d}.search input{flex:1;border:0;outline:0;padding:12px;font-size:16px;background:transparent}.search button{border:0;background:#111;color:#fff;border-radius:9px;padding:0 16px}.categories{max-width:1100px;margin:auto;padding:0 16px 10px;display:flex;gap:9px;overflow-x:auto}.chip{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.chip.active{background:#111;color:#fff;border-color:#111}.store{max-width:1100px;margin:auto;padding:12px 16px 30px}.store-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.store-head h2{margin:0;font-size:21px}.count{color:#777;font-size:13px}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e7e7e7;box-shadow:0 5px 18px #0000000a;display:flex;flex-direction:column}.card-img{height:210px;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden}.card-img img{width:100%;height:100%;object-fit:contain}.card-body{padding:15px;display:flex;flex-direction:column;flex:1}.badge{font-size:11px;color:#555;background:#f0f0f0;padding:5px 8px;border-radius:999px;display:inline-block;align-self:flex-start}.card h3{font-size:18px;margin:10px 0 7px}.desc{color:#666;font-size:14px;line-height:1.5;min-height:42px}.price{font-size:18px;font-weight:700;margin:12px 0}.stock{font-size:12px;color:#666;margin-bottom:12px}.card-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:auto}.btn{padding:11px 9px;border-radius:9px;text-align:center;font-weight:700;font-size:13px;border:1px solid #ddd}.btn.primary{background:#111;color:#fff;border-color:#111}.empty,.loading{grid-column:1/-1;text-align:center;padding:40px 20px;background:#fff;border-radius:15px;color:#666}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid #ddd;z-index:30;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.bottom-nav a{flex:1;max-width:160px;text-align:center;padding:9px 4px 6px;color:#777;font-size:11px}.bottom-nav a span{display:block;font-size:21px;line-height:24px;margin-bottom:2px}.bottom-nav a.active{color:#111;font-weight:700}.install{display:none;max-width:1100px;margin:0 auto 10px;padding:0 16px}.install button{width:100%;border:0;border-radius:12px;background:#111;color:#fff;padding:13px;font-weight:700}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:9px;display:none;z-index:40;font-size:13px}@media(max-width:800px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}.card-img{height:180px}}@media(max-width:520px){.hero h1{font-size:27px}.products{grid-template-columns:1fr 1fr;gap:10px}.card-img{height:145px}.card-body{padding:11px}.card h3{font-size:15px}.desc{font-size:12px;min-height:0}.price{font-size:15px}.card-actions{grid-template-columns:1fr}.btn{padding:9px 6px}.brand small{display:none}}
</style>

<style>body{padding-bottom:82px}.bottom-nav{z-index:9999}.bottom-nav .cart-count{background:#111;color:#fff}</style><style>
.tdm-app-header{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #e5e5e5;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:9px 14px;box-sizing:border-box}
.tdm-brand{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;text-decoration:none;color:#111}
.tdm-brand img{width:44px;height:44px;object-fit:contain;border-radius:9px;background:#fff}
.tdm-brand strong{display:block;font-size:17px;line-height:1.1}
.tdm-brand span{display:block;color:#777;font-size:10px;margin-top:3px}
@media(max-width:520px){.tdm-app-header{padding:8px 12px}.tdm-brand img{width:40px;height:40px}.tdm-brand strong{font-size:15px}.tdm-brand span{font-size:9px}}
</style><link rel="stylesheet" href="app.css">
<script src="app-common.js"></script>
<style>.product-detail{max-width:1100px;margin:0 auto;padding:20px 16px 40px}.detail-card{background:#fff;border:1px solid #fed7aa;border-radius:22px;overflow:hidden;box-shadow:0 14px 35px rgba(249,115,22,.12)}.detail-grid{display:grid;grid-template-columns:1fr 1fr}.detail-main-media{min-height:390px;background:#fff7ed;display:flex;align-items:center;justify-content:center;padding:18px}.detail-main-media img,.detail-main-media video{width:100%;height:100%;max-height:390px;object-fit:contain;border-radius:16px}.detail-info{padding:28px}.detail-info h1{font-size:34px;margin:0 0 10px}.detail-description{white-space:pre-wrap;color:#555;line-height:1.7}.detail-gallery{display:flex;gap:9px;overflow-x:auto;margin-top:14px}.detail-gallery button{border:2px solid #fed7aa;background:#fff;border-radius:12px;padding:3px;min-width:72px;height:72px}.detail-gallery img,.detail-gallery video{width:64px;height:64px;object-fit:cover;border-radius:9px}.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.detail-actions .btn{min-width:145px}.back-store{display:inline-flex;margin-bottom:14px;background:#fff7ed;color:#9a3412;border:1px solid #fdba74;padding:10px 14px;border-radius:11px;font-weight:800}@media(max-width:760px){.detail-grid{grid-template-columns:1fr}.detail-main-media{min-height:280px}.detail-info{padding:20px}.detail-info h1{font-size:27px}}</style>
</head>
<body>
<header class="tdm-app-header">
  <a class="tdm-brand" href="index.html" aria-label="TDM Manufacturing Home">
    <img src="logo.png" alt="TDM Manufacturing logo">
    <div><strong>TDM Manufacturing</strong><span>Precision Engineering &amp; Fabricated Equipment</span></div>
  </a>
</header>


<section class="hero"><h1>Equipment Store</h1><p>Browse TDM bakery, food-processing and engineering equipment.</p><div class="search"><input id="searchInput" type="search" placeholder="Search equipment..." autocomplete="off"><button id="searchBtn">Search</button></div></section>
<div class="categories" id="categories"><button class="chip active" data-category="all">All</button><button class="chip" data-category="bakery">Bakery</button><button class="chip" data-category="food-processing">Food Processing</button><button class="chip" data-category="custom">Custom Equipment</button></div>
<div class="install" id="installBox"><button id="installBtn">Install TDM App</button></div>
<main class="store"><div class="store-head"><h2>All Equipment</h2><span class="count" id="count">Loading...</span></div><section class="products" id="products"><div class="loading">Loading equipment...</div></section></main>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ctdmpigyhinaqpicbycq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_YNun4pQIhl7S6OJ1SBnYqg_NATcZhsm";
const supabaseClient=window.tdmGetSupabaseClient ? tdmGetSupabaseClient() : window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'tdm-supabase-auth'}});
const productsEl=document.getElementById('products'), countEl=document.getElementById('count'), searchInput=document.getElementById('searchInput');
let allProducts=[], activeCategory='all';
function parseMediaValue(v){
  if(!v) return [];
  if(Array.isArray(v)) return v.flatMap(parseMediaValue);
  if(typeof v==='object') return [v.url||v.publicUrl||v.src||v.path].filter(Boolean);
  const text=String(v).trim(); if(!text) return [];
  try{const parsed=JSON.parse(text);if(parsed!==text)return parseMediaValue(parsed);}catch(e){}
  return text.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
}
function mediaFor(p){
  const vals=[p.image_url,p.image,p.images,p.image_urls,p.media_urls,p.media,p.photos,p.photo_urls].flatMap(parseMediaValue);
  if(vals.length) return vals.map(v=>{const x=String(v);if(/^https?:\/\//i.test(x)||x.startsWith('data:')||x.startsWith('/')) return x;if(x.startsWith('tdm-media/')) return SUPABASE_URL+'/storage/v1/object/public/'+x;return x;});
  return ['logo.png'];
}
function imageFor(p){return mediaFor(p)[0]||'logo.png'}
function isVideo(url){return /\.(mp4|webm|ogg|mov)(\?|$)/i.test(String(url))}
function mediaMarkup(p){const src=imageFor(p);return isVideo(src)?`<video class="card-media" src="${escapeHtml(src)}" muted playsinline controls preload="metadata" onerror="this.outerHTML='<img class=\"card-media\" src=\"logo.png\" alt=\"TDM equipment\">'"></video>`:`<img class="card-media" src="${escapeHtml(src)}" alt="${escapeHtml(p.name||'TDM equipment')}" loading="lazy" onerror="this.onerror=null;this.src='logo.png'">`}
function categoryFor(p){return String(p.category||'bakery').toLowerCase().replace(/\s+/g,'-')}
function money(p){if(p.price===null||p.price===undefined||p.price==='')return 'Request quote';const n=Number(p.price);return `${p.currency||'₦'} ${Number.isFinite(n)?n.toLocaleString():p.price}`}
function detailUrl(p){return p.url||`product.html?product=${encodeURIComponent(p.id||p.slug||'')}`}
function render(){
  const detailId=new URLSearchParams(location.search).get('product');
  if(detailId){
    const p=allProducts.find(x=>String(x.id)===String(detailId)||String(x.slug)===String(detailId));
    if(p){renderDetail(p);return;}
  }
  document.getElementById('detailView')?.remove();document.querySelector('.store')?.removeAttribute('style');
  const filtered=allProducts.filter(p=>{const cat=categoryFor(p);const q=searchInput.value.trim().toLowerCase();return (activeCategory==='all'||cat===activeCategory) && (!q||String(p.name).toLowerCase().includes(q)||String(p.description||'').toLowerCase().includes(q));});
  countEl.textContent=`${filtered.length} item${filtered.length===1?'':'s'}`;
  if(!filtered.length){productsEl.innerHTML='<div class="empty">No equipment matches your search.</div>';return;}
  productsEl.innerHTML=filtered.map(p=>{const url=`product.html?product=${encodeURIComponent(p.id||p.slug||'')}`;const wa=`https://wa.me/2347049087007?text=${encodeURIComponent(`Hello TDM Manufacturing, I am interested in ${p.name}. Please send me more information and a quotation.`)}`;return `<article class="card"><a href="${escapeHtml(url)}" style="text-decoration:none;color:inherit"><div class="card-img">${mediaMarkup(p)}</div></a><div class="card-body"><span class="badge">${escapeHtml(p.category||'Equipment')}</span><h3>${escapeHtml(p.name||'TDM Equipment')}</h3><div class="desc">${escapeHtml(p.short_description||p.description||'TDM manufactured equipment.')}</div><div class="price">${money(p)}</div><div class="stock">${p.stock_quantity!==undefined&&p.stock_quantity!==null?`Stock: ${escapeHtml(String(p.stock_quantity))}`:'Made to order'}</div><div class="card-actions"><a class="btn" href="${wa}" target="_blank" rel="noopener">Contact Us</a><button class="btn primary" type="button" onclick='addToCart({id:${JSON.stringify(p.id||null)},name:${JSON.stringify(p.name||'TDM Equipment')},price:${Number(p.price)||0},image:${JSON.stringify(imageFor(p))}})'>Add to Cart</button><a class="btn" href="${escapeHtml(url)}">View Details</a></div></div></article>`}).join('');
}
function renderDetail(p){
  document.querySelector('.hero')?.setAttribute('style','display:none');document.getElementById('categories')?.setAttribute('style','display:none');document.querySelector('.store')?.setAttribute('style','display:none');
  let box=document.getElementById('detailView');if(!box){box=document.createElement('main');box.id='detailView';box.className='product-detail';document.querySelector('.bottom-nav').before(box);}
  const media=mediaFor(p);const first=media[0]||'logo.png';
  const wa=`https://wa.me/2347049087007?text=${encodeURIComponent(`Hello TDM Manufacturing, I am interested in ${p.name}. Please send me more information and a quotation.`)}`;
  box.innerHTML=`<a class="back-store" href="product.html">← Back to Store</a><section class="detail-card"><div class="detail-grid"><div><div class="detail-main-media" id="detailMain">${isVideo(first)?`<video src="${escapeHtml(first)}" controls playsinline></video>`:`<img src="${escapeHtml(first)}" alt="${escapeHtml(p.name||'TDM equipment')}" onerror="this.src='logo.png'">`}</div><div class="detail-gallery">${media.map((u,i)=>`<button type="button" onclick='selectDetailMedia(${JSON.stringify(u)})'>${isVideo(u)?`<video src="${escapeHtml(u)}" muted></video>`:`<img src="${escapeHtml(u)}" alt="Media ${i+1}">`}</button>`).join('')}</div></div><div class="detail-info"><span class="badge">${escapeHtml(p.category||'Equipment')}</span><h1>${escapeHtml(p.name||'TDM Equipment')}</h1><div class="price">${money(p)}</div><p class="detail-description">${escapeHtml(p.description||p.short_description||'No additional description available.')}</p><p class="stock">${p.stock_quantity!==undefined&&p.stock_quantity!==null?`Stock available: ${escapeHtml(String(p.stock_quantity))}`:'Made to order'}</p><div class="detail-actions"><button class="btn primary" type="button" onclick='addToCart({id:${JSON.stringify(p.id||null)},name:${JSON.stringify(p.name||'TDM Equipment')},price:${Number(p.price)||0},image:${JSON.stringify(first)}})'>Add to Cart</button><a class="btn" href="${wa}" target="_blank" rel="noopener">Contact Us</a></div></div></div></section>`;
}
function selectDetailMedia(u){const box=document.getElementById('detailMain');if(!box)return;box.innerHTML=isVideo(u)?`<video src="${escapeHtml(u)}" controls autoplay playsinline></video>`:`<img src="${escapeHtml(u)}" alt="TDM product media" onerror="this.src='logo.png'">`;}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function addToCart(item){
  const user=await tdmRequireCustomer('product.html'); if(!user) return;
  const key=String(item.name||'TDM Equipment'); const c=tdmReadCart(user.id); const found=c.find(x=>x.name===key);
  if(found) found.quantity=(Number(found.quantity)||1)+1; else c.push({name:key,price:Number(item.price)||0,image:item.image||'logo.png',quantity:1,product_id:item.id||null});
  tdmWriteCart(c,user.id); await tdmUpdateCartBadges(); showToast(key+' added to your cart');
}
function showToast(msg){let t=document.getElementById('tdmToast');if(!t){t=document.createElement('div');t.id='tdmToast';t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(window.__tdmToast);window.__tdmToast=setTimeout(()=>t.style.display='none',2200);}
async function logAffiliateVisit(){
  const params=new URLSearchParams(location.search); const ref=params.get('ref'); const productId=params.get('product');
  if(!ref) return;
  try{ const c=tdmGetSupabaseClient(); await c.rpc('tdm_log_affiliate_click',{p_affiliate_code:ref,p_product_id:productId||null}); }catch(e){ console.warn('Affiliate visit log:',e.message); }
}
logAffiliateVisit();
async function loadProducts(){
  try{const {data,error}=await supabaseClient.from('products').select('*').eq('status','published').order('created_at',{ascending:false});if(error) throw error;allProducts=Array.isArray(data)?data:[];render();}
  catch(e){console.error('TDM Store load error:',e);productsEl.innerHTML='<div class="empty"><h3>Unable to load Store</h3><p>'+escapeHtml(e.message||'Please refresh and try again.')+'</p></div>';countEl.textContent='';}
}
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCategory=b.dataset.category;render()}));searchInput.addEventListener('input',render);document.getElementById('searchBtn').addEventListener('click',render);loadProducts();
let deferredPrompt=null;function showInstall(){const x=document.getElementById('installBox');if(x)x.style.display='block';const top=document.getElementById('installTop');if(top)top.style.display='block'}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstall()});async function install(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;const x=document.getElementById('installBox');if(x)x.style.display='none'}const installBtn=document.getElementById('installBtn');if(installBtn)installBtn.addEventListener('click',install);window.addEventListener('appinstalled',()=>{const x=document.getElementById('installBox');if(x)x.style.display='none'});
if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(console.error);
</script>

<nav class="bottom-nav" aria-label="App navigation">
  <a href="index.html"><span>⌂</span>Home</a>
  <a href="product.html"><span>▦</span>Store</a>
  <a href="cart.html"><span>🛒</span>Cart <b id="cartCountBottom" class="cart-count">0</b></a>
  <a href="service.html"><span>⚙</span>Service</a>
  <a href="account.html"><span>♙</span>Account</a>
</nav>
</body>
</html>
