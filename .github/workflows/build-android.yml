name: Build TDM STORE Android App

on:
  push:
    branches:
      - tdm-store-mobile-app
    paths:
      - 'mobile-app/**'
      - 'icon-512x512.png'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare website
        run: |
          mkdir -p mobile-app/www
          find . -maxdepth 1 -type f \
            \( -name '*.html' -o \
               -name '*.js' -o \
               -name '*.css' -o \
               -name '*.png' -o \
               -name '*.json' -o \
               -name '*.xml' -o \
               -name '*.txt' \) \
            -exec cp {} mobile-app/www/ \;

      - name: Install dependencies
        working-directory: mobile-app
        run: |
          npm install
          npm install --save-dev @capacitor/assets

      - name: Generate Android project
        working-directory: mobile-app
        run: npx cap add android

      - name: Prepare official TDM icons
        run: |
          pip install pillow
          mkdir -p mobile-app/assets
          python - <<'PY'
          from PIL import Image

          logo = Image.open(
              "mobile-app/www/icon-512x512.png"
          ).convert("RGBA")

          icon = logo.resize(
              (1024, 1024),
              Image.Resampling.LANCZOS
          )

          icon.save("mobile-app/assets/icon-only.png")

          splash = Image.new(
              "RGB",
              (2732, 2732),
              "#080808"
          )

          splash_logo = logo.resize(
              (1700, 1700),
              Image.Resampling.LANCZOS
          )

          splash.paste(
              splash_logo,
              (516, 516),
              splash_logo
          )

          splash.save(
              "mobile-app/assets/splash.png"
          )
          PY

      - name: Generate native app icons
        working-directory: mobile-app
        run: npx capacitor-assets generate --android

      - name: Synchronize Android
        working-directory: mobile-app
        run: npx cap sync android

      - name: Build Android test APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug

      - name: Upload TDM STORE APK
        uses: actions/upload-artifact@v4
        with:
          name: TDM-STORE-Android-Test
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
