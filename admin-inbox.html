<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f97316"><title>TDM Admin | Customer Inbox</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-common.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7ed;font-family:Arial,sans-serif;color:#222;padding-bottom:25px}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #fed7aa;padding:12px 16px;z-index:5;display:flex;align-items:center;gap:12px}
header .back{margin-left:auto;white-space:nowrap;text-decoration:none;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:9px;padding:9px 11px;font-weight:700;font-size:13px}header img{width:42px;height:42px;object-fit:contain;border-radius:9px}header strong{display:block;color:#9a3412}header small{color:#777}
main{max-width:900px;margin:20px auto;padding:0 14px}.chat-shell{background:#fff;border:1px solid #fed7aa;border-radius:18px;overflow:hidden;box-shadow:0 8px 25px #9a34121a}
.chat-top{padding:16px;border-bottom:1px solid #eee}.chat-top h1{font-size:20px;margin:0 0 5px}.chat-top p{margin:0;color:#777;font-size:13px}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:65vh}.threads{border-right:1px solid #eee;padding:10px;overflow:auto}.threads h3{font-size:13px;color:#777}.thread{width:100%;text-align:left;padding:12px;border:0;border-radius:10px;background:#fff7ed;margin-bottom:7px;cursor:pointer}.thread.active{background:#ffedd5}.thread b{display:block;font-size:13px}.thread small{color:#777}
.conversation{display:flex;flex-direction:column;min-width:0;min-height:65vh}.messages{padding:16px;flex:1;overflow:auto;max-height:55vh;background:#fffdfb}.msg{max-width:85%;padding:10px 12px;border-radius:13px;margin:8px 0;background:#f1f5f9;overflow-wrap:anywhere}.msg.mine{margin-left:auto;background:#ffedd5}.msg small{display:block;color:#777;font-size:10px;margin-top:6px}.msg img,.msg video{max-width:100%;max-height:260px;border-radius:8px;display:block}.msg audio{max-width:100%}.composer{padding:12px;border-top:1px solid #eee;display:flex;gap:8px;flex-wrap:wrap}.composer textarea{width:100%;min-height:70px;resize:vertical;border:1px solid #ddd;border-radius:10px;padding:11px;font:inherit}.composer button,.pick{border:0;border-radius:9px;padding:10px 13px;background:#f97316;color:white;font-weight:700;cursor:pointer}.composer .secondary{background:#222}.composer button:disabled{opacity:.5}.hint{font-size:12px;color:#777;padding:0 12px 10px}.empty{padding:30px;text-align:center;color:#777}
@media(max-width:650px){.layout{grid-template-columns:1fr}.threads{border-right:0;border-bottom:1px solid #eee;max-height:160px}.conversation{min-height:55vh}.messages{max-height:45vh}}
</style></head><body>
<header><a href="admin-dashboard.html"><img src="logo.png" alt="TDM"></a><div><strong>TDM Manufacturing Admin</strong><small>Customer support inbox</small></div><a class="back" href="admin-dashboard.html">← Admin Dashboard</a></header>
<main><section class="chat-shell"><div class="chat-top"><h1>Customer Inbox</h1><p>Reply to customer enquiries and product conversations.</p></div>
<div class="layout"><aside class="threads"><h3>CUSTOMER THREADS</h3><div id="threadList">Loading…</div></aside>
<section class="conversation"><div id="activeTitle" class="chat-top"><b>Select a conversation</b></div><div class="messages" id="messages"><div class="empty">Sign in to start a conversation with TDM.</div></div>
<div class="composer"><textarea id="messageText" placeholder="Write a message…"></textarea>
<label class="pick" for="attachment">＋ Photo / Video / File</label><input id="attachment" type="file" accept="image/*,video/*" hidden>
<button id="recordBtn" class="secondary" type="button">🎙 Voice note</button><button id="sendBtn" type="button">Send</button></div><div class="hint" id="chatStatus">Photos, videos and voice notes up to 50 MB.</div></section></div></section></main>
<script src="tdm-chat.js"></script></body></html>
